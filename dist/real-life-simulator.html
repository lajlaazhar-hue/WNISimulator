  U.appSummary = (id) => {
    const G = U.G;
    switch (id) {
      case 'bank': return t(`Saldo ${fmt(G.wallet)}`, `Balance ${fmt(G.wallet)}`);
      case 'bills': { const b = E.billsThisMonth(G).filter((x) => x.status !== 'paid'); return t(`${b.length} tagihan belum dibayar`, `${b.length} unpaid bill(s)`); }
      case 'futureme': return t(`Tabungan ${fmt(G.savings)}`, `Savings ${fmt(G.savings)}`);
      case 'appy': return t(`${G.appy.listings.length} lowongan`, `${G.appy.listings.length} listings`);
      case 'aku': return t(`Kesejahteraan ${G.mood.wellbeing}/100`, `Wellbeing ${G.mood.wellbeing}/100`);
      default: return L(U.APPS[id].name);
    }
  };
  function sheetView() {
    if (!ui.sheet) return '';
    const fn = U.sheets[ui.sheet.type];
    const inner = fn ? fn(ui.sheet) : '';
    if (!inner) return '';
    return `<div class="overlay" data-a="sheet-close" data-self="1"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}<button class="btn sec" data-a="sheet-close">${t('Tutup', 'Close')}</button></div></div>`;
  }
  function eventView() {
    const G = U.G;
    if (!G.activeEvent || !ui.eventOpen) return '';

    return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="evt"><div class="grab"></div>
      <div class="row">${U.appTile(U.APPS[ev.app] ? ev.app : 'calendar', 36)}<span class="small muted">${t('Hari', 'Day')} ${ev.day} · ${t('keputusan', 'decision')}</span></div>
      <h3 id="evt">${T(ev.title)}</h3><p class="evbody">${T(ev.body)}</p>
      ${ev.choices.map((ch, i) => `<button class="choice" data-a="choose" data-x="${i}"><span>${T(ch.label)}${ch.note ? `<br><span class="small muted">${T(ch.note)}</span>` : ''}</span><b>${ch.cost > 0 ? fmt(-ch.cost) : ch.cost < 0 ? fmt(-ch.cost, { plus: true }) : 'Rp0'}</b></button>`).join('')}
      <small class="muted">${pill('ILLUSTRATIVE')} ${t('Nominal kejadian adalah nilai permainan.', 'Event amounts are gameplay values.')} ${t('Saldo', 'Balance')}: ${fmt(G.wallet)}.</small>
      <button class="btn ghost" data-a="event-close">${t('Putuskan nanti', 'Decide later')}</button></div></div>`;
  }

  // ── side panels (desktop) ───────────────────────────────────────────
  U.caseFile = () => {
    const G = U.G;
    let html = `<div class="brand"><h1>Real Life<br>Simulator</h1><p>${t('Gajimu tetap. Pengeluaranmu tidak.', 'Your salary is fixed. Your expenses aren\'t.')}</p>
      <div class="tag">${t('Mampu hidup layak, atau hanya bertahan?', 'Can you afford to live, or only afford to survive?')}</div></div>`;
    if (!G) return html + `<div class="card-paper"><h2>${t('Cara main', 'How it works')}</h2><small>${t('Buat karaktermu, pilih kota di Indonesia, lalu jalani sebulan dengan upah minimum 2026 setempat. Semua angka diberi label Terverifikasi, Perkiraan, atau Ilustratif; aplikasi Sumber menunjukkan asalnya.', 'Create your character, pick a city in Indonesia and live a month on its 2026 minimum wage. Every figure is labelled Verified, Estimated or Illustrative; the Sources app shows where it came from.')}</small></div>`;
    const { city, province } = E.getLocality(G.config.cityId);
    const w = E.resolveWage(G.config.cityId);
    const ch = G.config.character;
    const job = G.job;
    html += `<div class="card-paper"><h2>${t('Berkas karakter', 'Case file')}</h2>
      <div class="kv"><span>${t('Kota', 'Place')}</span><span>${esc(city.name)}, ${esc(province.name)}</span></div>
      <div class="kv"><span>${t('Profil', 'Profile')}</span><span>${ch.age} ${t('th', 'y')} · ${T(D.jobs.eduById[ch.education].label)}</span></div>
      <div class="kv"><span>${t('Upah minimum', 'Wage floor')}</span><span class="num">${fmt(w.amount, { exact: true })}</span></div>
      <div class="kv"><span>${t('Pekerjaan', 'Job')}</span><span>${job ? T(job.title) : t('Belum bekerja', 'Not working')}</span></div>
      <div class="kv"><span>${t('Rumah tangga', 'Household')}</span><span>${E.members(G).people} ${t('orang', 'people')}</span></div>
      <div class="kv"><span>Seed</span><span class="num">${G.seed}</span></div>
      <small>${t('Upah minimum adalah batas bawah hukum. Banyak pekerja dibayar lebih, sebagian dibayar kurang, dan gaji bersih lebih kecil setelah potongan.', 'A minimum wage is a legal floor. Many workers earn more, some are paid less, and take-home pay is lower after deductions.')}</small></div>`;
    const m = G.mood;
    html += `<div class="card-paper"><h2>${t('Hari ini', 'Today')}</h2>${U.meter(t('Kesejahteraan', 'Wellbeing'), m.wellbeing)}${U.meter(t('Energi', 'Energy'), m.energy)}${U.meter(t('Stres', 'Stress'), m.stress, true)}${U.meter(t('Godaan belanja', 'Temptation'), m.temptation, true)}</div>`;
    return html;

  U.tapeView = () => {
    const G = U.G;

    const rows = G.transactions.filter((x) => x.cls !== 'opening').slice(0, 18).map((x) => `<div class="tape-row ${x.status === 'failed' ? 'failed' : ''}"><span class="m">${x.day} · ${T(x.merchant)}</span><span class="${x.amount > 0 ? 'pos' : 'neg'}">${fmt(x.amount, { plus: x.amount > 0 })}</span></div>`).join('');
    return `<div class="tape"><h2>— PAYDAY BANK —</h2>${rows || `<small>${t('Belum ada transaksi.', 'No transactions yet.')}</small>`}
      <div class="tape-row tot"><span>${t('SALDO', 'BALANCE')}</span><span>${fmt(G.wallet)}</span></div><div class="tape-row tot"><span>${t('TABUNGAN', 'SAVINGS')}</span><span>${fmt(G.savings)}</span></div>
      ${E.debtOutstanding(G) ? `<div class="tape-row tot"><span>${t('UTANG', 'DEBT')}</span><span>${fmt(E.debtOutstanding(G))}</span></div>` : ''}</div>
      <small>${t('Keyboard: Esc untuk kembali.', 'Keyboard: Esc goes back.')}</small>`;
  };

  // ── shared actions ──────────────────────────────────────────────────
  U.after = (prev) => { U.showLatestBanner(prev); U.save(); };
  U.prev = () => (U.G ? U.G.notifications.length : 0);
  Object.assign(U.A, {
    home() { U.goHome(); }, back() { U.back(); },
    lang() { U.setLang(I.lang === 'id' ? 'en' : 'id'); },

    notif(el) {
      const G = U.G;
      const n = G.notifications.find((x) => x.id === el.dataset.x);
      if (!n) return;
      n.read = true; ui.banner = null;
      if (n.tone === 'event' && G.activeEvent) { ui.eventOpen = true; ui.nc = false; }
      else if (n.urgeId) { const u = G.urges.find((x) => x.id === n.urgeId); U.openApp(RLS.data.catalog.byId[u ? u.itemId : ''] ? RLS.data.catalog.byId[u.itemId].store : U.appFor(n)); if (u) ui.sheet = { type: 'item', id: u.itemId, urge: u.id }; }
      else if (n.orderId && U.storeState) { U.openApp(n.app); U.storeState(n.app).view = 'orders'; }
      else U.openApp(U.appFor(n));
      U.save();
    },
    open(el) { U.openApp(el.dataset.x); if (el.dataset.cat && U.storeState) U.storeState(el.dataset.x).cat = el.dataset.cat; if (el.dataset.tab) U.setSub(el.dataset.x, { tab: el.dataset.tab }); },
    tab(el) { U.setSub(el.dataset.app, { tab: el.dataset.x, detail: null }); },

    'event-open'() { ui.eventOpen = true; },
    'event-close'() { ui.eventOpen = false; },
    choose(el) { const p = U.prev(); if (U.result(E.resolveEvent(U.G, Number(el.dataset.x)), t('Keputusan dicatat.', 'Decision made.'))) ui.eventOpen = !!U.G.activeEvent; U.after(p); },
    fix(el) {
      const k = el.dataset.x;
      if (k === 'passport' || el.dataset.doc === 'passport') U.openApp('berkas', { tab: 'passport' });
      else if (k === 'doc') { U.openApp('berkas'); if (el.dataset.doc) ui.sheet = { type: 'doc', id: el.dataset.doc }; }
      else if (k === 'futureme') U.openApp('futureme');
      else if (k === 'course') { U.openApp('shopsquare'); U.storeState('shopsquare').cat = 'school'; }
      else if (k === 'english' || k === 'portfolio') U.openApp('appy', { tab: 'improve', detail: null });
      else if (k === 'unpaid') U.setSub('jelajah', { unpaidOk: true });
    },
  });

  // ── boot & event routing ────────────────────────────────────────────
  U.boot = () => {
    U.initLang();
    const rootEl = document.getElementById('app');
    rootEl.addEventListener('click', (e) => {
      const el = e.target.closest('[data-a]');
      if (!el || !rootEl.contains(el) || el.disabled) return;
      const fn = U.A[el.dataset.a];
      if (!fn) return;
      if (el.dataset.self && e.target !== el) return;
      if (ui.banner && el.dataset.a !== 'notif') ui.banner = null;
      fn(el, e);
      U.render();
    });
    rootEl.addEventListener('dblclick', (e) => { if (e.target.closest('[data-dbl="switcher"]')) { ui.switcher = true; U.render(); } });

      body += `<div class="li row"><span class="grow"><span class="t">${T(dd.name)}</span><span class="s">${s && s.active ? `${t('Diperpanjang tgl', 'Renews day')} ${s.renewDay}` : s ? t('Dibatalkan', 'Cancelled') : t('Belum berlangganan', 'Not subscribed')} · ${pill(dd.status)}</span></span><b class="num">${fmt(dd.price)}</b>
        ${s && s.active ? `<button class="btn sm sec" data-a="unsub" data-x="${dd.id}">${t('Batalkan', 'Cancel')}</button>` : `<button class="btn sm" data-a="subscribe" data-x="${dd.id}">${t('Langganan', 'Subscribe')}</button>`}</div>`;
    }
    body += `</div><div class="section-t">${t('Tagihan rutin', 'Recurring bills')}</div><div class="list">${E.billsThisMonth(g).map((b) => `<div class="li row"><span class="grow"><span class="t">${T(b.label)}</span><span class="s">${t('Tempo tgl', 'Due day')} ${b.dueDay}</span></span><span class="num">${fmt(b.amount)}</span></div>`).join('')}</div>`;
    return U.frame('recurring', body);
  };

  // ── Pinjam (borrowing) ──────────────────────────────────────────────
  function lenderVisible(g, l) { return l.kind !== 'illegal' || g.loanOffers.some((o) => o.lenderId === 'illegal' && o.expiresAbs >= E.today(g)); }
  function kindText(l) {
    if (l.kind === 'flat_monthly') return t(`Cicilan bulanan · bunga flat ${(l.rate * 100).toLocaleString('id-ID')}%/bln${l.upfrontFee ? ` · biaya di muka ${Math.round(l.upfrontFee * 100)}%` : ''} · tenor ${l.tenors.join('/')} bln`, `Monthly instalments · flat ${(l.rate * 100).toLocaleString('en-US')}%/month${l.upfrontFee ? ` · ${Math.round(l.upfrontFee * 100)}% upfront fee` : ''} · ${l.tenors.join('/')} months`);
    if (l.kind === 'daily_bullet') return t(`Sekali bayar setelah ${l.days} hari · ${(l.dailyRate * 100).toLocaleString('id-ID')}%/hari`, `One repayment after ${l.days} days · ${(l.dailyRate * 100).toLocaleString('en-US')}%/day`);
    return t(`Tenor ${l.days} hari · ${Math.round(l.withhold * 100)}% dipotong di muka · denda ${Math.round(l.lateDaily * 100)}%/hari`, `${l.days}-day term · ${Math.round(l.withhold * 100)}% withheld · ${Math.round(l.lateDaily * 100)}%/day penalty`);
  }
  function lateText(l) {
    if (l.kind === 'illegal') return t('Denda harian sangat tinggi, penagihan dengan mempermalukan lewat kontak ponsel. Ini melanggar hukum.', 'Very high daily penalties and debt-shaming through your phone contacts. This is unlawful.');
    if (!l.late) return '';
    if (l.late.type === 'daily') return t(`Telat: denda ${(l.late.rate * 100).toLocaleString('id-ID')}% per hari dari cicilan; total biaya dibatasi 100% pokok. Skor kredit (fiktif) turun dan penagih menghubungi.`, `Late: ${(l.late.rate * 100).toLocaleString('en-US')}% of the instalment per day; total cost capped at 100% of principal. Your (fictional) credit score drops and collectors call.`);
    if (l.late.amount) return t(`Telat: denda ${fmt(M.rp(l.late.amount))} per cicilan; skor kredit (fiktif) turun.`, `Late: ${fmt(M.rp(l.late.amount))} per instalment; your (fictional) credit score drops.`);
    return t('Dipotong otomatis dari gaji, jadi jarang telat. Kalau gaji tidak cukup, cicilan menunggak.', 'Deducted from your salary, so rarely late. If your pay can\'t cover it, the instalment goes overdue.');
  }
  U.apps.pinjam = () => {
    const g = G();
    const tab = U.sub('pinjam', 'tab', 'offers');
    const sel = U.sub('pinjam', 'detail', null);
    if (sel) return loanDetail(sel);
    const debt = E.debtOutstanding(g);
    let body = `<div class="hero" style="background:#8b3a3a;color:#fff"><span class="lbl">${t('Total utang tersisa (pokok + bunga)', 'Debt outstanding (principal + interest)')}</span><span class="big num" style="font-family:var(--f-display)">${fmt(debt)}</span>
      <div class="split"><span>${t('Pokok', 'Principal')}<b>${fmt(E.principalOutstanding(g))}</b></span><span>${t('Pinjaman aktif', 'Active loans')}<b>${E.activeLoans(g).length}</b></span><span>${t('Skor kredit (fiktif)', 'Credit score (fictional)')}<b>${g.credit}/100</b></span></div></div>`;
    if (tab === 'offers') {
      body += `<small class="muted">${t('Uang pinjaman bukan pendapatan. Setiap cicilan terbagi atas pokok dan bunga/biaya; laporan menghitung bunga sebagai biaya keuangan. Semua pemberi pinjaman di sini fiktif.', 'Borrowed money is not income. Each instalment splits into principal and interest/fees; reports count interest as a finance cost. Every lender here is fictional.')}</small>`;
      for (const l of D.lenders.filter((x) => lenderVisible(g, x))) {
        const el = E.loanEligibility(g, l.id);
        const illegal = l.kind === 'illegal';
        body += `<div class="box ${illegal ? 'danger' : 'outline'}"><div class="row"><span class="grow"><span class="t">${T(l.name)}</span><span class="s">${esc(kindText(l))}</span></span>${illegal ? `<span class="pill p-warn">${t('ILEGAL', 'ILLEGAL')}</span>` : l.regulated && l.p2p ? `<span class="pill p-ok">${t('Berizin (fiktif)', 'Licensed (fictional)')}</span>` : pill(l.status)}</div>
          <small>${T(l.blurb)}</small>
          ${el.ok ? `<small class="muted">${t('Bisa diajukan', 'Available')}: ${fmt(el.min)} – ${fmt(el.max)}</small>` : `<div class="reqs">${el.reasons.map((r) => `<div class="req no">${ic('X')}<span>${T(r)}</span></div>`).join('')}</div>`}
          <button class="btn sm ${illegal ? 'warn' : 'sec'}" data-a="loan-sel" data-x="${l.id}">${illegal ? t('Lihat isi tawaran ini', 'See what this offer really is') : t('Simulasi biaya', 'See the full cost')}</button></div>`;
      }
    } else if (tab === 'loans') {
      const loans = g.loans.slice().reverse();
      body += loans.map((ln) => {
        const l = E.lender(ln.lenderId);
        const st = { active: [bi('Aktif', 'Active'), 'p-due'], late: [bi('Menunggak', 'Overdue'), 'p-warn'], repaid: [bi('Lunas', 'Repaid'), 'p-ok'] }[ln.status] || [bi(ln.status, ln.status), 'p-muted'];
        return `<div class="box outline"><div class="row"><span class="grow"><span class="t">${T(ln.name)}</span><span class="s">${t('Diterima', 'Received')} ${fmt(ln.received)} · ${t('total bayar', 'total to repay')} ${fmt(ln.totalRepay)} · ${t('biaya', 'cost')} ${fmt(ln.cost)} · APR ±${pct(ln.apr)}</span></span><span class="pill ${st[1]}">${T(st[0])}</span></div>
          <div class="list">${ln.schedule.map((s) => `<div class="li row"><span class="pill ${s.paid ? 'p-ok' : s.dueAbs < E.today(g) ? 'p-warn' : 'p-muted'}">${s.n}/${ln.schedule.length}</span><span class="grow small">${esc(E.absLabel(s.dueAbs))}${s.lateFee ? ` · ${t('denda', 'late fee')} ${fmt(s.lateFee)}` : ''}</span><span class="num">${fmt(s.amount + (s.lateFee || 0))}</span></div>`).join('')}</div>
          ${['active', 'late'].includes(ln.status) ? `<button class="btn sm" data-a="loan-early" data-x="${ln.id}">${t('Bayar cicilan berikutnya sekarang', 'Pay the next instalment now')}</button>` : ''}
          ${ln.reported ? `<small class="muted">${t('Sudah dilaporkan ke OJK dan polisi.', 'Reported to OJK and the police.')}</small>` : ''}
          ${l && l.kind === 'illegal' && ln.status !== 'repaid' ? `<small style="color:var(--coral)">${t('Kamu tidak wajib menerima penagihan yang mengancam atau mempermalukan. Laporkan ke OJK (157).', 'You do not have to put up with threats or shaming. Report it to OJK (157).')}</small>` : ''}</div>`;
      }).join('') || `<div class="empty">${t('Belum pernah meminjam.', 'No loans yet.')}</div>`;
    } else {
      body += `<div class="box"><b>${t('Ciri pinjaman berizin', 'Signs of a licensed lender')}</b>
        <div class="reqs">${[bi('Terdaftar dan diawasi OJK (cek daftar resmi OJK)', 'Registered with and supervised by OJK (check the official list)'), bi('Biaya total, bunga, denda dan jadwal ditunjukkan sebelum kamu setuju', 'Total cost, interest, penalties and schedule shown before you agree'), bi('Pinjol konsumtif 2026: biaya maks. 0,1% per hari; maks. 3 platform per orang', 'Consumer P2P 2026: max 0.1% per day all-in; at most 3 platforms per person'), bi('Hanya boleh mengakses kamera, mikrofon dan lokasi', 'May only access camera, microphone and location')].map((x) => `<div class="req ok">${ic('Check')}<span>${T(x)}</span></div>`).join('')}</div></div>
        <div class="box danger"><b>${t('Tanda bahaya pinjol ilegal', 'Red flags of an illegal lender')}</b>
        <div class="reqs">${[bi('Menawarkan lewat SMS/WhatsApp dari nomor pribadi', 'Offers by SMS/WhatsApp from personal numbers'), bi('"Cair 5 menit tanpa syarat"', '"Cash in 5 minutes, no requirements"'), bi('Uang yang diterima jauh lebih kecil dari yang "disetujui"', 'You receive much less than the "approved" amount'), bi('Meminta akses kontak dan galeri ponsel', 'Asks for access to your contacts and photo gallery'), bi('Tenor sangat pendek dan denda harian tinggi', 'Very short term and steep daily penalties')].map((x) => `<div class="req no">${ic('X')}<span>${T(x)}</span></div>`).join('')}</div>
        <small>${t('Laporkan ke OJK lewat kontak 157 dan ke polisi. Penagihan yang mengancam atau mempermalukan melanggar hukum.', 'Report to OJK on contact 157 and to the police. Collection that threatens or shames you is unlawful.')}</small></div>
        <small class="muted">${t('Batas biaya dan jumlah platform', 'Cost cap and platform limit')}: ${srcLink('ojk_p2p')}. ${t('Produk koperasi, bank dan paylater di game ini ilustratif.', 'Cooperative, bank and paylater terms in this game are illustrative.')}</small>`;
    }
    return U.frame('pinjam', body, { tabs: U.tabs('pinjam', [['offers', bi('Pilihan', 'Options')], ['loans', bi('Pinjamanku', 'My loans')], ['learn', bi('Kenali pinjol', 'Know the signs')]], tab), scrollKey: tab });
  };
  function loanDetail(id) {
    const g = G();
    const l = E.lender(id);
    const el = E.loanEligibility(g, id);
    const illegal = l.kind === 'illegal';
    const maxMajor = Math.max(el.min, el.max) / 100, minMajor = el.min / 100;
    let amt = Number(U.sub('pinjam', 'amt', minMajor));
    amt = Math.min(Math.max(amt, minMajor), maxMajor);
    const tenors = l.tenors || [null];
    const tenor = Number(U.sub('pinjam', 'tenor', tenors[0])) || tenors[0];
    const q = E.loanQuote(g, id, M.rp(amt), tenor);
    const ack = U.sub('pinjam', 'ack', false);
    let body = `${illegal ? `<div class="box danger"><b>${ic('ShieldAlert')} ${t('Ini contoh pinjaman ilegal', 'This is an example of an illegal loan')}</b><small>${t('Tidak terdaftar di OJK. Tawaran seperti ini bukan produk keuangan yang normal: potongan di muka besar, tenor sangat pendek, denda harian tinggi, dan penagihan lewat kontak ponselmu.', 'Not registered with OJK. Offers like this are not a normal financial product: a large upfront cut, a very short term, steep daily penalties, and collection through your phone contacts.')}</small></div>` : ''}
      <div class="box"><div class="kv"><span>${t('Pemberi pinjaman', 'Lender')}</span><span>${T(l.name)}</span></div><small class="muted">${esc(kindText(l))}</small></div>`;
    if (el.ok) {
      body += `<div class="box outline"><div class="field"><label for="lamt">${t('Jumlah pinjaman', 'Loan amount')}: <b class="num">${fmt(M.rp(amt))}</b></label><input id="lamt" type="range" min="${minMajor}" max="${maxMajor}" step="100000" value="${amt}" data-in="lamt"></div>
        ${l.tenors ? `<div class="field"><span class="lab">${t('Tenor', 'Term')}</span>${U.seg('loan-tenor', 'tenor', tenor, l.tenors.map((n) => [n, bi(`${n} bulan`, `${n} months`)]))}</div>` : ''}</div>`;
    }
    body += `<div class="receipt">
      <div class="kv"><span>${t('Disetujui', 'Approved amount')}</span><span>${fmt(q.amount)}</span></div>
      ${q.upfrontFee ? `<div class="kv"><span>${illegal ? t('"Biaya admin" dipotong', '"Admin fee" withheld') : t('Biaya di muka', 'Upfront fee')}</span><span>${fmt(-q.upfrontFee)}</span></div>` : ''}
      <div class="kv tot"><span>${t('Yang kamu terima', 'What you receive')}</span><span>${fmt(q.received)}</span></div><hr>
      <div class="kv"><span>${t('Total yang wajib dibayar', 'Total you must repay')}</span><span>${fmt(q.totalRepay)}</span></div>
      <div class="kv tot"><span>${t('Biaya meminjam', 'Cost of borrowing')}</span><span>${fmt(q.cost)}</span></div>
      <div class="kv"><span>${t('Setara per tahun (APR, perkiraan)', 'Annualised (APR, estimate)')}</span><span>${pct(q.apr)}</span></div><hr>
      ${q.schedule.map((s) => `<div class="kv"><span>${t('Cicilan', 'Instalment')} ${s.n} · ${esc(E.absLabel(s.dueAbs))}</span><span>${fmt(s.amount)}</span></div>`).join('')}</div>
      ${q.notes.map((n) => `<small class="muted">${T(n)}</small>`).join('')}
      <div class="box"><b>${t('Kalau telat bayar', 'If you pay late')}</b><small>${esc(lateText(l))}</small></div>`;
    if (!el.ok) body += `<div class="reqs">${el.reasons.map((r) => `<div class="req no">${ic('X')}<span>${T(r)}</span></div>`).join('')}</div>`;
    else if (illegal) body += `<div class="toggle"><span>${t('Saya mengerti ini pinjaman ilegal dengan risiko penagihan yang merugikan', 'I understand this is an illegal loan with harmful collection risks')}</span>${U.sw('loan-ack', 'ack', ack)}</div>`;
    const foot = `<div class="setup-foot"><button class="btn sec" data-a="loan-back">${illegal ? t('Tolak & abaikan', 'Decline & ignore') : t('Kembali', 'Back')}</button>${el.ok ? `<button class="btn ${illegal ? 'warn' : ''}" data-a="loan-take" data-x="${id}" ${illegal && !ack ? 'disabled' : ''}>${t('Ajukan', 'Borrow')} ${fmt(q.amount)}</button>` : ''}</div>`;
    return U.frame('pinjam', body, { title: L(l.name), backLabel: t('Pinjam', 'Borrow'), foot, scrollKey: 'detail' + id });
  }

  // ── Report ──────────────────────────────────────────────────────────
  U.apps.report = () => {
    const g = G();
    const final = g.phase === 'report';
    const r = final ? g.lastReport : E.generateMonthlyReport(g);
    const pastIdx = U.sub('report', 'past', null);
    const rep = pastIdx != null ? g.reports[pastIdx] : r;
    const kv = (l, v, style = '') => `<div class="kv"><span>${l}</span><span ${style}>${v}</span></div>`;
    let body = '';
    if (g.reports.length) body += `<div class="chips">${`<button class="chip ${pastIdx == null ? 'on' : ''}" data-a="rep-past" data-x="">${final ? t('Bulan ini', 'This month') : t('Sejauh ini', 'Month to date')}</button>`}${g.reports.map((x, i) => `<button class="chip ${pastIdx === i ? 'on' : ''}" data-a="rep-past" data-x="${i}">${t('Bulan', 'Month')} ${x.monthIndex}</button>`).join('')}</div>`;
    body += `<div class="hero" style="background:#0d4d63;color:#fff"><span class="lbl">${final && pastIdx == null ? t('Bulan selesai', 'Month complete') : `${t('Bulan', 'Month')} ${rep.monthIndex}${pastIdx == null ? ', ' + t('sejauh ini', 'so far') : ''}`}</span>
      <span class="big num" style="font-family:var(--f-display)">${fmt(rep.remaining)}</span><span class="lbl">${t('sisa pendapatan setelah pengeluaran, bunga, dan biaya sekali bayar', 'income left after spending, interest and one-off costs')}</span>
      <div class="split"><span>${t('Pendapatan', 'Income')}<b>${fmt(rep.income)}</b></span><span>${t('Pengeluaran', 'Spent')}<b>${fmt(rep.consumption)}</b></span><span>${t('Ke tabungan', 'To savings')}<b>${fmt(rep.netSavings)}</b></span></div></div>`;
    body += `<div class="section-t">${t('Posisimu', 'Where you landed')}</div><div class="ladder">${rep.ladder.map((x) => `<div class="rung ${x.reached ? 'on' : ''}"><span class="mk">${ic(x.reached ? 'Check' : 'Minus')}</span><span class="grow"><span class="t">${T(x.label)}</span>${x.detail ? `<span class="s small muted" style="display:block">${T(x.detail)}</span>` : ''}</span><span class="small">${x.reached ? t('Tercapai', 'Reached') : t('Belum', 'Not yet')}</span></div>`).join('')}</div>`;
    const met = (label, v, f) => `<div class="box outline metric"><span class="t" style="font-weight:700">${label}</span><span class="v">${pct(v)}</span><span class="f">${f}</span></div>`;
    body += `<div class="section-t">${t('Ukuran', 'Metrics')}</div>
      ${met(t('Rasio kebutuhan pokok', 'Essential expense ratio'), rep.essentialRatio, `(${t('tagihan', 'bills')} ${short(rep.mandatory)} + ${t('kebutuhan harian', 'everyday')} ${short(rep.variableEssential)} + ${t('kejutan pokok', 'essential surprises')} ${short(rep.unexpectedEss)} + ${t('bunga', 'interest')} ${short(rep.financeCost)}) ÷ ${t('pendapatan', 'income')} ${short(rep.income)}`)}
      ${met(t('Rasio belanja opsional', 'Discretionary ratio'), rep.discretionaryRatio, `(${t('opsional', 'optional')} ${short(rep.discretionary)} + ${t('kejutan opsional', 'optional surprises')} ${short(rep.unexpectedDisc)}) ÷ ${t('pendapatan', 'income')}`)}
      ${met(t('Tingkat menabung', 'Savings rate'), rep.savingsRate, `(${t('masuk', 'in')} ${short(rep.savingsIn)} − ${t('ditarik', 'out')} ${short(rep.savingsOut)}) ÷ ${t('pendapatan', 'income')}`)}
      <div class="box outline metric"><span class="t" style="font-weight:700">${t('Sisa pendapatan', 'Remaining income')}</span><span class="v">${short(rep.remaining)}</span><span class="f">${t('pendapatan', 'income')} ${short(rep.income)} − ${t('konsumsi', 'consumption')} ${short(rep.consumption)} − ${t('bunga', 'interest')} ${short(rep.financeCost)} − ${t('sekali bayar', 'one-off')} ${short(rep.upfront)}. ${t('Pinjaman yang cair dan pokok yang dibayar tidak dihitung sebagai pendapatan atau pengeluaran.', 'Loan money received and principal repaid are not counted as income or spending.')}</span></div>`;
    body += `<div class="section-t">${t('Rincian', 'Breakdown')}</div><div class="receipt">
      ${kv(t('Gaji', 'Salary'), fmt(rep.salary))}${rep.household ? kv(t('Penghasilan rumah tangga', 'Household income'), fmt(rep.household)) : ''}${kv(t('Pendapatan tambahan', 'Extra income'), fmt(rep.extraIncome))}${rep.benefits ? kv(t('Jaminan sosial (JHT/JKP)', 'Benefits (JHT/JKP)'), fmt(rep.benefits)) : ''}${rep.severance ? kv(t('Pesangon', 'Severance'), fmt(rep.severance)) : ''}<hr>
      ${kv(t('Tagihan wajib', 'Mandatory bills'), fmt(rep.mandatory))}${kv(t('Kebutuhan harian', 'Everyday essentials'), fmt(rep.variableEssential))}${kv(t('Belanja opsional', 'Optional spending'), fmt(rep.discretionary))}${kv(t('Tak terduga', 'Unexpected'), fmt(rep.unexpected))}${kv(t('Sekali bayar', 'One-off upfront'), fmt(rep.upfront))}${rep.refunds ? kv(t('Pengembalian dana (sudah dikurangkan)', 'Refunds (already netted)'), fmt(rep.refunds)) : ''}<hr>
      ${kv(t('Pinjaman cair', 'Loans received'), fmt(rep.loanIn))}${kv(t('Pokok dibayar', 'Principal repaid'), fmt(rep.principalRepaid))}${kv(t('Bunga & biaya pinjaman', 'Interest & loan fees'), fmt(rep.financeCost))}${kv(t('Utang di akhir', 'Debt at end'), fmt(rep.debtEnd))}<hr>
      ${kv(t('Kewajiban belum dibayar', 'Unpaid obligations'), fmt(rep.unpaidTotal), rep.unpaidTotal ? 'style="color:var(--coral)"' : '')}${kv(t('Saldo akhir', 'Wallet at end'), fmt(rep.walletEnd))}${kv(t('Tabungan akhir', 'Savings at end'), fmt(rep.savingsEnd))}<hr>
      ${kv(t('Makanan terbuang', 'Food wasted'), fmt(rep.waste))}${kv(t('Nilai stok makanan', 'Food in stock'), fmt(rep.inventoryValue))}${kv(t('Gizi 5 hari (perkiraan)', 'Nutrition, 5 days (estimate)'), `${rep.nutrition.score}/100 · ${T(rep.nutrition.label)}`)}<hr>
      ${kv(t('Kesejahteraan rata-rata', 'Average wellbeing'), rep.mood.wellbeing + '/100')}${kv(t('Stres rata-rata', 'Average stress'), rep.mood.stress + '/100')}${kv(t('Bosan rata-rata', 'Average boredom'), rep.mood.boredom + '/100')}${kv(t('Cemas soal uang', 'Financial anxiety'), rep.mood.anxiety + '/100')}<hr>
      ${kv(t('Barang opsional dibeli', 'Optional items bought'), rep.counters.optionalBought)}${kv(t('Keinginan ditahan / ditunda', 'Urges resisted / postponed'), `${rep.counters.resisted} / ${rep.counters.postponed}`)}${kv(t('Dibeli karena keinginan', 'Bought on an urge'), rep.counters.urgeBought)}
      ${kv(t('Masak / beli makan / terlewat', 'Cooked / bought / missed meals'), `${rep.counters.cooked} / ${rep.counters.boughtMeals} / ${rep.counters.missedMeals}`)}${kv(t('Hari tanpa listrik', 'Days without power'), rep.counters.outageDays)}
      ${kv(t('Hari sakit / terlambat / absen', 'Sick / late / missed workdays'), `${rep.counters.sickDays} / ${rep.counters.lateDays} / ${rep.counters.missedWork}`)}${kv(t('Kegiatan gratis / berbayar', 'Free / paid activities'), `${rep.counters.freeActivities} / ${rep.counters.paidActivities}`)}
      ${kv(t('Lamaran / wawancara / tawaran / ditolak', 'Applications / interviews / offers / rejections'), `${rep.counters.applications} / ${rep.counters.interviews} / ${rep.counters.offers} / ${rep.counters.rejections}`)}${rep.perf != null ? kv(t('Kinerja rata-rata', 'Average performance'), rep.perf + '/100') : ''}</div>
      ${rep.unpaid.length ? `<div class="box"><b>${t('Belum dibayar', 'Unpaid')}</b>${rep.unpaid.map((u) => `<div class="kv"><span>${T(u.label)}</span><span class="num">${fmt(u.amount)}</span></div>`).join('')}<small class="muted">${t('Pindah ke bulan depan sebagai tunggakan.', 'These carry into next month as arrears.')}</small></div>` : ''}
      <small class="muted">${t('Tangga ini menggambarkan apa yang dimungkinkan bulan ini, bukan seberapa "pintar" kamu bermain. Pilihan yang sama berakhir berbeda di kota atau rumah yang berbeda.', 'The ladder describes what the month allowed, not how "well" you played. The same choices land differently in a different city or home.')}</small>`;
    const foot = final && pastIdx == null ? `<div class="setup-foot"><button class="btn sec" data-a="open" data-x="compare">${t('Bandingkan tempat', 'Compare places')}</button><button class="btn" data-a="next-month">${t('Mulai bulan', 'Start month')} ${g.monthIndex + 1}</button></div>` : '';

      body += pantryStrip() + `<div class="box"><div class="kv"><span>${t('Belanja dapur bulan ini', 'Groceries this month')}</span><span class="num">${fmt(groc)} / ${fmt(g.config.groceryBudget)}</span></div><div class="bar warm"><i style="width:${Math.min(100, (groc / Math.max(1, g.config.groceryBudget)) * 100)}%"></i></div>
        <input type="range" aria-label="${t('Anggaran belanja dapur', 'Grocery budget')}" min="300000" max="4000000" step="50000" value="${g.config.groceryBudget / 100}" data-in="grocbudget">
        <div class="chips">${Object.entries(D.baskets).map(([k, b]) => `<button class="chip" data-a="basket" data-x="${k}">${ic('ShoppingBasket')} ${T(b.label)}</button>`).join('')}</div>
        <small class="muted">${t('Paket belanja hanya mengisi keranjang; semuanya bisa diubah. Tanpa kulkas, belanja lauk segar untuk 1–2 hari saja.', 'Baskets only fill your cart; change anything. Without a fridge, buy fresh protein for a day or two only.')}${E.servings(g) > 1 ? ' ' + t(`Rumah tanggamu butuh ${E.servings(g)} porsi per makan.`, `Your household needs ${E.servings(g)} portions per meal.`) : ''}</small></div>`;
    }
    if (id === 'care') {
      const jkn = E.hasJkn(g), via = E.hasJknViaWork(g);
      const c = E.cond(g);
      const working = E.isScheduledToWork(g) && !g.day.leave;
      body += `<div class="box"><div class="row">${ic('ShieldCheck')}<span class="grow"><span class="t">${jkn ? t('JKN aktif', 'JKN active') : t('Tidak ada JKN aktif', 'No active JKN')}</span><span class="s">${via ? t('Lewat potongan gaji (1%). Periksa di faskes tingkat 1 dan rujukan ditanggung; obat di apotek di bawah bayar sendiri.', 'Through payroll (1%). Primary-care visits and referrals are covered; pharmacy items below are out of pocket.') : jkn ? t('Iuran mandiri kelas 3 dibayar tiap bulan.', 'You pay the independent class 3 contribution each month.') : t('Tanpa kantor yang mendaftarkan, kamu bisa ikut JKN mandiri kelas 3 (Rp35.000/orang/bulan setelah bantuan pemerintah).', 'Without an employer, you can join JKN independently (class 3, Rp35,000 per person per month after the government share).')}</span></span></div>
        ${via ? '' : `<div class="toggle"><span>${t('Bayar JKN mandiri kelas 3', 'Pay JKN class 3 independently')}</span>${U.sw('cfg-t', 'jknMandiri', g.config.jknMandiri)}</div><small class="muted">${pill('ESTIMATED')} ${t('Mulai jadi tagihan bulan depan.', 'Starts as a bill next month.')}</small>`}
        <div class="kv"><span>${t('Kondisimu', 'How you feel')}</span><span>${T(c.label)}</span></div>
        <div class="row" style="gap:6px;flex-wrap:wrap">${jkn ? `<button class="btn sm" data-a="clinic-jkn">${t('Periksa di faskes JKN', 'See your JKN clinic')}</button>` : ''}${working ? `<button class="btn sm sec" data-a="sick-leave">${t('Izin sakit hari ini', 'Call in sick today')}</button>` : ''}</div>
        <small class="muted">${t('Game ini tidak memberi nasihat medis.', 'This game does not give medical advice.')}</small></div>`;
    }
    if (id === 'shopsquare' || id === 'glow') {
      const left = g.wallet - E.unpaidBillsTotal(g);
      body += `<div class="box"><span class="small">${t('Uang setelah tagihan bulan ini', 'Money after this month\'s bills')}: <b class="num" style="color:${left < 0 ? 'var(--coral)' : 'inherit'}">${fmt(left)}</b> · ${t('godaan belanja', 'temptation')} ${g.mood.temptation}/100</span>
        ${id === 'glow' ? `<small class="muted">${t('Perawatan dasar (sabun, sampo, potong rambut sederhana) sudah cukup untuk memenuhi aturan kerja. Produk premium bersifat pilihan pribadi.', 'Basic care (soap, shampoo, a simple haircut) is enough for workplace rules. Premium products are a personal choice.')}</small>` : ''}</div>`;
    }
    return body;
  }

  function storeApp(id) {
    const g = G();
    const st = U.storeState(id);
    if (st.view === 'cart') return cartView(id);
    if (st.view === 'orders') return ordersView(id);
    if (st.view === 'wish') return wishView(id);
    const all = D.catalog.items.filter((i) => i.store === id && !E.itemAvailability(i, g).hidden);
    const cats = D.catalog.departments[id].filter(([k]) => all.some((i) => i.dept === k));
    if (!cats.some(([k]) => k === st.cat)) st.cat = cats[0][0];
    let body = storeTop(id);
    const deals = E.todaysDeals(g).filter((d) => d.item.store === id && !E.itemAvailability(d.item, g).hidden);
    body += `<div class="search">${ic('Search')}<input id="q-${id}" type="search" placeholder="${t('Cari di', 'Search')} ${T(U.APPS[id].name)}" value="${esc(st.q)}" data-in="storeq" data-store="${id}" aria-label="${t('Cari produk', 'Search products')}"></div>
      <div class="chips">${[['all', bi('Semua', 'All')], ['budget', TIER.budget], ['standard', TIER.standard], ['premium', TIER.premium]].map(([k, l]) => `<button class="chip ${st.tier === k ? 'on' : ''}" data-a="stier" data-store="${id}" data-x="${k}">${T(l)}</button>`).join('')}
      ${[['all', bi('Semua jenis', 'Any kind')], ['essential', bi('Kebutuhan', 'Essentials')], ['local', bi('Lokal', 'Local')], ['imported', bi('Impor', 'Imported')], ['deals', bi(`Diskon (${deals.length})`, `Deals (${deals.length})`)]].map(([k, l]) => `<button class="chip ${st.filter === k ? 'on' : ''}" data-a="sfilter" data-store="${id}" data-x="${k}">${T(l)}</button>`).join('')}</div>
      <div class="field"><span class="lab">${t('Urutkan', 'Sort')}</span>${U.seg('ssort', id, st.sort, [['default', bi('Tingkat', 'By tier')], ['price', bi('Termurah', 'Cheapest')], ['unit', bi('Harga satuan', 'Unit price')], ['durable', bi('Paling awet', 'Most durable')]])}</div>`;
    let items = st.q ? all.filter((i) => (L(i.name) + ' ' + (i.brand || '')).toLowerCase().includes(st.q.toLowerCase())) : st.filter === 'deals' ? all : all.filter((i) => i.dept === st.cat);
    if (st.tier !== 'all') items = items.filter((i) => i.tier === st.tier);
    if (st.filter === 'essential') items = items.filter((i) => i.essential);
    if (st.filter === 'local') items = items.filter((i) => i.origin === 'local');
    if (st.filter === 'imported') items = items.filter((i) => i.origin === 'imported');
    if (st.filter === 'deals') items = items.filter((i) => E.dealFor(g, i));
    const box = (list) => `<div class="box outline" style="padding:0 12px">${list.map((i) => prodRow(id, i)).join('')}</div>`;
    if (st.sort !== 'default') {
      const key = { price: (i) => E.priceNow(g, i), unit: unitValue, durable: (i) => -(i.durability || 0) }[st.sort];
      items = [...items].sort((a, b) => key(a) - key(b));
      body += items.length ? box(items) : `<div class="empty">${t('Tidak ada yang cocok.', 'No matches.')}</div>`;
      if (st.sort === 'unit') body += `<small class="muted">${t('Diurutkan per 100 g/ml atau per buah, supaya ukuran kemasan bisa dibandingkan adil.', 'Sorted per 100 g/ml or per piece, so package sizes compare fairly.')}</small>`;
    } else {
      for (const tier of ['budget', 'standard', 'premium']) {
        const list = items.filter((i) => i.tier === tier);
        if (!list.length) continue;
        const avg = Math.round(list.reduce((s, i) => s + E.priceOf(i, g.config), 0) / list.length);
        body += `<div class="tier-h tier-${tier}"><h3>${T(TIER[tier])}</h3><span class="small muted">${t('rata-rata', 'avg')} ${fmt(avg)}</span></div>${box(list)}`;
      }
      if (!items.length) body += `<div class="empty">${t('Tidak ada yang cocok.', 'No matches.')}</div>`;
    }
    body += id === 'dailymart' ? `<small class="muted">${t('Harga beras, telur, ayam, sapi dan minyak goreng yang terverifikasi adalah rata-rata nasional panel harga Bapanas (Jan–Feb 2026). Harga lokal berbeda, terutama di Indonesia timur; sesuaikan di Pengaturan. Merek fiktif.', 'Verified rice, egg, chicken, beef and cooking-oil prices are national averages from the Bapanas price panel (Jan–Feb 2026). Local prices differ, especially in eastern Indonesia; adjust in Settings. Brands are fictional.')}</small>`
      : `<small class="muted">${pill('ILLUSTRATIVE')} ${t('Harga, merek, diskon, stok dan pengiriman di toko ini adalah nilai game; mereknya fiktif. Gambar produk adalah ilustrasi.', 'Prices, brands, deals, stock and delivery in this store are gameplay values; brands are fictional. Product pictures are illustrations.')}</small>`;
    const lines = cartLines(id);
    const quote = E.quoteCart(g, lines);
    const nOrders = g.orders.filter((o) => o.store === id && ['shipped', 'replacement', 'damaged'].includes(o.status)).length;
    const nWish = g.wishlist.filter((w) => D.catalog.byId[w] && D.catalog.byId[w].store === id).length;
    const tabs = `<div class="tabs" role="tablist">${st.q || st.filter === 'deals' ? '' : cats.map(([k, l]) => `<button class="chip ${st.cat === k ? 'on' : ''}" data-a="scat" data-store="${id}" data-x="${k}">${T(l)}</button>`).join('')}
      <button class="chip" data-a="sview" data-store="${id}" data-x="orders">${ic('Package')} ${t('Pesanan', 'Orders')}${nOrders ? ` (${nOrders})` : ''}</button>${id !== 'care' ? `<button class="chip" data-a="sview" data-store="${id}" data-x="wish">${ic('Heart')} ${t('Wishlist', 'Wishlist')}${nWish ? ` (${nWish})` : ''}</button>` : ''}</div>`;
    const foot = lines.length ? `<button class="cartbar" data-a="sview" data-store="${id}" data-x="cart">${ic('ShoppingCart')}<span class="grow">${lines.reduce((s, l) => s + l.qty, 0)} ${t('barang', 'items')}</span><b>${fmt(quote.total)}</b>${ic('ChevronRight')}</button>` : '';
    return U.frame(id, body, { tabs, foot, scrollKey: st.cat + st.q + st.filter + st.tier + st.sort });
  }

  function cartView(id) {
    const g = G();
    const st = U.storeState(id);
    const lines = cartLines(id);
    const quote = E.quoteCart(g, lines);
    const opts = E.deliveryOptions(g, id, quote.total);
    let opt = opts.find((o) => o.id === st.delivery && o.available) || cheapest(opts) || opts[0];
    const fee = opt && opt.available ? opt.fee : 0;
    const total = quote.total + fee;
    const desire = quote.lines.some((l) => !l.item.essential);
    const afterBills = g.wallet - E.unpaidBillsTotal(g) - total;
    const week = E.estimateDailyEssentials(g) * 7;
    let body = `<div class="list">${quote.lines.map((l) => `<div class="li row">${U.ptile(l.item)}<span class="grow"><span class="t">${T(l.item.name)}</span><span class="s">${fmt(l.unit)} × ${l.qty} · ${T(TIER[l.item.tier])}${E.dealFor(g, l.item) ? ` · ${t('diskon', 'deal')} −${E.dealFor(g, l.item).pct}%` : ''}</span></span>
      <span class="qty"><button data-a="qty" data-store="${id}" data-x="${l.item.id}" data-d="-1" aria-label="${t('Kurangi', 'Remove one')}">${ic('Minus')}</button><span>${l.qty}</span><button data-a="qty" data-store="${id}" data-x="${l.item.id}" data-d="1" aria-label="${t('Tambah', 'Add one')}">${ic('Plus')}</button></span></div>`).join('') || `<div class="empty">${t('Keranjang kosong.', 'Your cart is empty.')}</div>`}</div>`;
    if (quote.lines.length) {
      body += `<div class="section-t">${t('Pengiriman', 'Delivery')}</div><div class="box outline">${opts.map((o) => `<button class="opt ${opt && o.id === opt.id ? 'on' : ''}" data-a="sdeliv" data-store="${id}" data-x="${o.id}" ${o.available ? '' : 'disabled'}><span class="grow"><span class="t">${T(o.label)}</span><span class="s">${Array.isArray(o.days) ? (o.days[1] ? t(`tiba ${o.days[0]}–${o.days[1]} hari`, `arrives in ${o.days[0]}–${o.days[1]} days`) : t('hari ini', 'today')) : o.days === 0 ? t('langsung', 'right away') : ''}${o.note ? ' · ' + T(o.note) : ''}${o.available ? '' : ' · ' + (E.isOnline(g) ? t('tidak tersedia di daerahmu', 'not available in your area') : t('butuh internet', 'needs internet'))}</span></span><b class="num">${o.fee ? fmt(o.fee) : t('Gratis', 'Free')}</b></button>`).join('')}
        ${id !== 'dailymart' ? `<small class="muted">${t('Paket bisa terlambat atau datang rusak (kejadian game); kamu bisa minta pengembalian dana atau penggantian.', 'Parcels can be late or arrive damaged (game events); you can ask for a refund or a replacement.')}</small>` : ''}</div>
        <div class="receipt"><div class="kv"><span>${t('Kebutuhan', 'Essentials')}</span><span>${fmt(quote.essential)}</span></div><div class="kv"><span>${t('Opsional', 'Optional')}</span><span>${fmt(quote.discretionary)}</span></div>
        ${quote.saved ? `<div class="kv"><span>${t('Hemat dari diskon', 'Saved on deals')}</span><span>${fmt(-quote.saved)}</span></div>` : ''}<div class="kv"><span>${t('Ongkir & biaya layanan', 'Delivery & service fee')}</span><span>${fmt(fee)}</span></div><hr>
        <div class="kv tot"><span>${t('Total bayar', 'Total to pay')}</span><span>${fmt(total)}</span></div><div class="kv"><span>${t('Saldo setelahnya', 'Balance after')}</span><span style="color:${g.wallet - total < 0 ? 'var(--coral)' : 'inherit'}">${fmt(g.wallet - total)}</span></div>
        <div class="kv"><span>${t('Setelah tagihan bulan ini', 'After this month\'s bills')}</span><span style="color:${afterBills < 0 ? 'var(--coral)' : 'inherit'}">${fmt(afterBills)}</span></div></div>`;
      if (desire) body += `<div class="box"><b class="small">${t('Sebelum membayar', 'Before you pay')}</b><small>${t(`Kebutuhan pokok seminggu ±${fmt(week)}. ${afterBills < week ? 'Setelah belanja ini, uangmu tidak cukup untuk seminggu kebutuhan pokok.' : 'Kebutuhan pokok seminggu masih tertutup.'} Menunda memindahkan barang ke wishlist tanpa biaya.`, `A week of essentials is about ${fmt(week)}. ${afterBills < week ? 'After this, your money won\'t cover a week of essentials.' : 'A week of essentials is still covered.'} Postponing moves items to your wishlist at no cost.`)}</small></div>`;
    }
    const foot = `<div class="setup-foot">${id === 'shopsquare' || id === 'glow' ? `<button class="btn sec" data-a="postpone" data-x="${id}" ${lines.length ? '' : 'disabled'}>${t('Tunda', 'Postpone')}</button>` : `<button class="btn sec" data-a="cart-clear" data-x="${id}" ${lines.length ? '' : 'disabled'}>${t('Kosongkan', 'Clear')}</button>`}<button class="btn" data-a="checkout" data-x="${id}" ${lines.length && opt && opt.available ? '' : 'disabled'}>${t('Bayar', 'Pay')} ${fmt(total)}</button></div>`;
    return U.frame(id, body, { title: t('Keranjang', 'Cart'), backLabel: L(U.APPS[id].short || U.APPS[id].name), foot, scrollKey: 'cart' });
  }

  const ORDER_ST = { shipped: [bi('Dikirim', 'Shipped'), 'p-due'], replacement: [bi('Pengganti dikirim', 'Replacement on the way'), 'p-due'], delivered: [bi('Diterima', 'Delivered'), 'p-ok'], damaged: [bi('Rusak / tidak sesuai', 'Damaged / wrong item'), 'p-warn'], refunded: [bi('Dana dikembalikan', 'Refunded'), 'p-muted'] };
  function ordersView(id) {
    const g = G();
    const list = g.orders.filter((o) => o.store === id);
    const body = list.map((o) => {
      const [lab, cls] = ORDER_ST[o.status] || [bi(o.status, o.status), 'p-muted'];
      return `<div class="box outline"><div class="row"><span class="grow"><span class="t">${t('Pesanan', 'Order')} ${esc(o.id)} · ${esc(E.absLabel(o.placedAbs))}</span><span class="s">${o.lines.map((l) => `${T(D.catalog.byId[l.itemId].name)} × ${l.qty}`).join(', ')}</span></span><span class="pill ${cls}">${T(lab)}</span></div>
        <div class="kv"><span>${t('Total', 'Total')}</span><span class="num">${fmt(o.total)}</span></div>
        ${['shipped', 'replacement'].includes(o.status) ? `<div class="kv"><span>${t('Perkiraan tiba', 'Expected')}</span><span>${esc(E.absLabel(o.etaAbs))}${o.promisedAbs && o.etaAbs > o.promisedAbs ? ' · ' + t('terlambat', 'delayed') : ''}</span></div>` : ''}
        ${o.status === 'delivered' && o.deliveredAbs ? `<div class="kv"><span>${t('Diterima', 'Delivered')}</span><span>${esc(E.absLabel(o.deliveredAbs))}</span></div>` : ''}
        ${o.refund ? `<div class="kv"><span>${t('Dana kembali (barang, tanpa ongkir)', 'Refunded (goods, not shipping)')}</span><span class="num">${fmt(o.refund)}</span></div>` : ''}
        ${o.events.length ? `<small class="muted">${o.events.map((e) => `${esc(E.absLabel(e.abs))}: ${T({ delay: bi('tertahan di gudang ekspedisi', 'held at the courier hub'), damaged: bi('datang rusak', 'arrived damaged'), replacement: bi('pengganti dikirim', 'replacement sent'), refund: bi('dana dikembalikan', 'refunded') }[e.kind])}`).join(' · ')}</small>` : ''}
        ${o.status === 'damaged' ? `<div class="row" style="gap:6px"><button class="btn sm" data-a="order-fix" data-x="${o.id}" data-k="refund">${t('Minta pengembalian dana', 'Ask for a refund')}</button><button class="btn sm sec" data-a="order-fix" data-x="${o.id}" data-k="replace">${t('Minta barang pengganti', 'Ask for a replacement')}</button></div>` : ''}</div>`;
    }).join('') || `<div class="empty">${t('Belum ada pesanan.', 'No orders yet.')}</div>`;
    return U.frame(id, body, { title: t('Pesanan', 'Orders'), backLabel: L(U.APPS[id].short || U.APPS[id].name), scrollKey: 'orders' });
  }
  function wishView(id) {
    const g = G();
    const list = g.wishlist.map((w) => D.catalog.byId[w]).filter((i) => i && i.store === id);
    const body = `<small class="muted">${t('Wishlist tidak dihitung sebagai pengeluaran. Barang di sini bisa dibeli kapan saja, atau dibiarkan saja.', 'The wishlist is not spending. Buy these whenever you like, or never.')}</small>${list.length ? `<div class="box outline" style="padding:0 12px">${list.map((i) => prodRow(id, i)).join('')}</div>` : `<div class="empty">${t('Wishlist kosong.', 'Your wishlist is empty.')}</div>`}`;
    return U.frame(id, body, { title: t('Wishlist', 'Wishlist'), backLabel: L(U.APPS[id].short || U.APPS[id].name), scrollKey: 'wish' });
  }
  STORES.forEach((id) => { U.apps[id] = () => storeApp(id); });

  // ── product sheet ───────────────────────────────────────────────────
  U.sheets.item = (sh) => {
    const g = G();
    const it = D.catalog.byId[sh.id];
    if (!it) return '';
    const p = E.priceNow(g, it), base = E.priceOf(it, g.config);
    const deal = E.dealFor(g, it);
    const av = E.itemAvailability(it, g);
    const s = U.src(it.sourceId);
    const urge = sh.urge ? g.urges.find((u) => u.id === sh.urge) : null;
    const wish = g.wishlist.includes(it.id);
    const left = g.wallet - E.unpaidBillsTotal(g);
    return `<div class="row" style="align-items:flex-start">${U.ptile(it, true)}<span class="grow"><h3>${T(it.name)}</h3><span class="small muted">${it.brand ? esc(it.brand) + ' · ' : ''}${esc(it.size)}</span></span></div>
      <div class="chips">${pill(E.priceStatus(it, g.config))}<span class="pill p-muted">${T(TIER[it.tier])}</span><span class="pill p-muted">${it.essential ? t('Kebutuhan', 'Essential') : t('Opsional', 'Optional')}</span><span class="pill p-muted">${it.origin === 'imported' ? t('Impor', 'Imported') : t('Lokal', 'Local')}</span>${deal ? `<span class="pill p-deal">${t('Diskon hari ini', 'Today\'s deal')} −${deal.pct}%</span>` : ''}${av.ok ? '' : `<span class="pill p-warn">${T(av.reason)}</span>`}</div>
      ${urge ? `<div class="box urge-box"><b class="small">${t('Kenapa ingin sekarang', 'Why you want it now')}</b><small>${T(urge.reason)}</small><div class="bar warm"><i style="width:${urge.intensity}%"></i></div><small class="muted">${t('Uang setelah tagihan', 'Money after bills')}: ${fmt(left)}. ${t('Tidak ada yang dibeli otomatis.', 'Nothing is bought automatically.')}</small>
        <div class="row" style="gap:6px"><button class="btn sm sec" data-a="urge-resist" data-x="${urge.id}">${t('Tahan dulu', 'Hold off')}</button><button class="btn sm sec" data-a="urge-wish" data-x="${urge.id}">${t('Simpan ke wishlist', 'Save for later')}</button></div></div>` : ''}
      <div class="receipt"><div class="kv"><span>${t('Harga', 'Price')}</span><span>${deal ? `<s>${fmt(base)}</s> ` : ''}${fmt(p)}</span></div><div class="kv"><span>${t('Kemasan', 'Package')}</span><span>${esc(it.size)}</span></div>${unitPrice(it, p) ? `<div class="kv"><span>${t('Harga satuan', 'Unit price')}</span><span>${unitPrice(it, p)}</span></div>` : ''}
        <div class="kv"><span>${t('Diamati', 'Observed')}</span><span>${esc(it.observed || t('tidak diamati', 'not observed'))}</span></div><div class="kv"><span>${t('Pengiriman', 'Delivery')}</span><span>${it.delivery === 'instant' ? t('langsung', 'immediate') : t('paket', 'parcel')}</span></div><hr>
        ${effects(it).map((x) => `<div class="small">• ${T(x)}</div>`).join('') || `<div class="small">—</div>`}</div>
      <div class="small">${s && s.type === 'game' ? `${pill('ILLUSTRATIVE')} ${t('Nilai permainan yang masuk akal, bukan harga yang diamati. Mereknya fiktif.', 'A plausible gameplay value, not an observed price. The brand is fictional.')}` : s ? `${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)} — ${esc(s.note)}` : ''}</div>${it.note ? `<div class="small muted">${T(it.note)}</div>` : ''}
      <div class="row" style="gap:8px">${it.store !== 'care' ? `<button class="btn sec" data-a="wish" data-x="${it.id}">${ic(wish ? 'HeartOff' : 'Heart')} ${wish ? t('Hapus dari wishlist', 'Remove from wishlist') : t('Wishlist', 'Wishlist')}</button>` : ''}<button class="btn" style="flex:1" data-a="qty" data-store="${it.store}" data-x="${it.id}" data-d="1" ${av.ok ? '' : 'disabled'}>${t('Tambah ke keranjang', 'Add to cart')}</button></div>`;
  };

  // ── QuickBite ───────────────────────────────────────────────────────
  U.apps.quickbite = () => {
