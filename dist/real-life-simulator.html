<title>Real Life Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulasi hidup dengan upah minimum 2026 di Indonesia, lewat antarmuka ponsel. A phone-based life simulation on a 2026 Indonesian minimum wage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..125,500..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a phone on a desk. Desktop shows a case file (left) and a receipt tape (right) beside the device; phones get the device full-screen. */
:root {
  /* stage (outside the phone) */
  --stage: #dde4e6;
  --stage-ink: #1b2a2b;
  --stage-muted: #5a6b6c;
  --stage-line: #c4cfd1;
  --paper: #f7f9f8;
  /* phone OS */
  --surface: #fbfcfc;
  --surface-2: #eef3f3;
  --surface-3: #e2e9e9;
  --ink: #132322;
  --muted: #5b6d6b;
  --line: #d4dddc;
  --teal: #0f6e69;
  --teal-ink: #ffffff;
  --marigold: #e39a12;
  --marigold-soft: #fdf1d8;
  --coral: #c8473d;
  --coral-soft: #fbe5e2;
  --green: #2a7d4a;
  --green-soft: #def1e4;
  --amber-soft: #fbefcf;
  --amber-ink: #85570a;
  --violet-soft: #ebe7f6;
  --violet-ink: #5a4791;
  --grey-soft: #e6eaea;
  --grey-ink: #5d6767;
  --scrim: rgba(10, 20, 20, .45);
  --shadow: 0 1px 2px rgba(12, 30, 30, .08), 0 6px 18px rgba(12, 30, 30, .08);
  --wall-a: #0d5f5f;
  --wall-b: #e7a43c;
  --wall-c: #f3d7a0;
  --f-display: 'Anybody', 'Arial Narrow', system-ui, sans-serif;
  --f-ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #0e1516; --stage-ink: #dfe8e8; --stage-muted: #8ea0a0; --stage-line: #253233; --paper: #141d1e;
    --surface: #111a1b; --surface-2: #192526; --surface-3: #223031; --ink: #e6eeed; --muted: #93a5a3; --line: #2a3839;
    --teal: #3fb3aa; --teal-ink: #062221; --marigold: #f0b445; --marigold-soft: #3a2c10; --coral: #f07a6f; --coral-soft: #3b1d1a;
    --green: #67c58a; --green-soft: #15301f; --amber-soft: #3a2c10; --amber-ink: #f3c46b; --violet-soft: #26213a; --violet-ink: #b9aaf0;
    --grey-soft: #222c2d; --grey-ink: #a3b0b0; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    --wall-a: #062f30; --wall-b: #8a5a17; --wall-c: #3b2a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #0e1516; --stage-ink: #dfe8e8; --stage-muted: #8ea0a0; --stage-line: #253233; --paper: #141d1e;
  --surface: #111a1b; --surface-2: #192526; --surface-3: #223031; --ink: #e6eeed; --muted: #93a5a3; --line: #2a3839;
  --teal: #3fb3aa; --teal-ink: #062221; --marigold: #f0b445; --marigold-soft: #3a2c10; --coral: #f07a6f; --coral-soft: #3b1d1a;
  --green: #67c58a; --green-soft: #15301f; --amber-soft: #3a2c10; --amber-ink: #f3c46b; --violet-soft: #26213a; --violet-ink: #b9aaf0;
  --grey-soft: #222c2d; --grey-ink: #a3b0b0; --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  --wall-a: #062f30; --wall-b: #8a5a17; --wall-c: #3b2a12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
#app { height: 100%; }
body { background: var(--stage); color: var(--stage-ink); font-family: var(--f-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }

/* ── Stage ───────────────────────────────────────────────── */
.stage { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 32px; align-items: start;
  padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { min-width: 0; max-width: 340px; display: flex; flex-direction: column; gap: 16px; padding-top: 24px; }
.side.left { justify-self: end; }
.side.right { justify-self: start; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 34px; line-height: .95; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--stage-muted); font-size: 13px; }
.brand .tag { font-family: var(--f-display); font-stretch: 100%; font-weight: 600; font-size: 15px; color: var(--stage-ink); margin-top: 6px; }
.card-paper { background: var(--paper); border: 1px solid var(--stage-line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.card-paper h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--stage-muted); margin: 0; font-weight: 700; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv span:first-child { color: var(--stage-muted); }
.kv span:last-child { text-align: right; min-width: 0; }
.tape { font-family: var(--f-mono); font-size: 12px; background: var(--paper); border: 1px solid var(--stage-line); border-radius: 4px; padding: 14px 14px 18px;
  background-image: radial-gradient(circle at 6px 0, transparent 5px, var(--paper) 5.5px); background-size: 12px 100%; }
.tape h2 { font-family: var(--f-mono); font-size: 12px; text-align: center; letter-spacing: .1em; margin: 0 0 8px; color: var(--stage-muted); font-weight: 500; }
.tape-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--stage-line); }
.tape-row .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tape-row .neg { color: var(--stage-ink); }
.tape-row .pos { color: var(--green); }
.tape-row.failed { color: var(--stage-muted); text-decoration: line-through; }
.side small, .note { color: var(--stage-muted); font-size: 12px; line-height: 1.45; }

/* ── Device ──────────────────────────────────────────────── */
.device { width: 392px; height: min(844px, calc(100vh - 56px)); min-height: 640px; border-radius: 52px; padding: 11px; background: #0b1213;
  box-shadow: 0 0 0 1.5px #2b3a3b, 0 30px 60px rgba(10, 30, 30, .28), inset 0 0 0 1px #1c2829; position: relative; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--surface); color: var(--ink); display: flex; flex-direction: column; isolation: isolate; }
@media (max-width: 1180px) { .stage { grid-template-columns: minmax(0, 1fr) auto; } .side.right { display: none; } }
@media (max-width: 860px) {
  .stage { display: block; padding: 0; min-height: 0; height: 100%; }
  .side { display: none; }
  .device { width: 100%; height: 100%; min-height: 0; border-radius: 0; padding: 0; background: none; box-shadow: none; }
  .screen { border-radius: 0; }
}

/* status bar */
.status { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0; font-size: 13px; font-weight: 600; position: relative; z-index: 30; }
.status.on-wall { color: #fff; }
.status .notch { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); width: 96px; height: 27px; border-radius: 20px; background: #0b1213; }
@media (max-width: 860px) { .status .notch { display: none; } .status { padding: 4px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); } }
.status .right { display: flex; align-items: center; gap: 6px; }
.status button { background: none; border: 0; padding: 0; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.batt { display: inline-flex; align-items: center; gap: 3px; }
.batt b { display: inline-block; width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; padding: 1px; }
.batt b i { display: block; height: 100%; background: currentColor; border-radius: 1px; }
.batt.low b i { background: var(--coral); }

.view { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.homebar { height: 22px; flex: none; display: flex; justify-content: center; align-items: center; position: relative; z-index: 30; }
.homebar button { width: 134px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; border: 0; padding: 0; }
.homebar.on-wall button { background: #fff; }

/* ── Home ───────────────────────────────────────────────── */
.wall { position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(120% 70% at 85% 105%, var(--wall-c) 0%, transparent 55%),
    radial-gradient(90% 60% at 10% 100%, var(--wall-b) 0%, transparent 60%),
    linear-gradient(170deg, var(--wall-a) 0%, #0b4a4c 45%, var(--wall-b) 100%); }
.wall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; opacity: .22;
  background: linear-gradient(transparent 0 30%, #000 30%) 0 0 / 34px 100%, linear-gradient(transparent 0 55%, #000 55%) 17px 0 / 46px 100%; }
.home { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 8px; display: flex; flex-direction: column; gap: 14px; color: #fff; }
.home.has-banner { padding-top: 104px; transition: padding .2s; }
.widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.w { border-radius: 22px; padding: 14px; background: rgba(255,255,255,.16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.18); color: #fff; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.w.wide { grid-column: span 2; }
.w .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; font-weight: 700; }
.w .big { white-space: nowrap; font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: 27px; line-height: 1; letter-spacing: -.01em; }
.w .sub { font-size: 12px; opacity: .9; }
.w .meter { height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.w .meter i { display: block; height: 100%; background: #fff; border-radius: 3px; }
.w-day { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.w-day .d { font-family: var(--f-display); font-weight: 800; font-stretch: 80%; font-size: 38px; line-height: .9; white-space: nowrap; }
.btn-end { background: #fff; color: #0b3b3c; border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn-end:disabled { opacity: .55; cursor: not-allowed; }
.needs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.need { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; text-align: center; }
.need b { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }
.need.bad b { color: #ffd0c7; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; padding-top: 4px; }
.app-ico { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; font-size: 11.5px; font-weight: 500; min-width: 0; position: relative; }
.app-ico .tile { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.app-ico .tile svg.i { width: 28px; height: 28px; }
.app-ico .nm { max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.badge { position: absolute; top: -5px; right: 6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; border: 2px solid rgba(255,255,255,.9); }
.dock { margin: 0 12px 4px; border-radius: 30px; padding: 12px 10px; background: rgba(255,255,255,.2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: grid; grid-template-columns: repeat(4, 1fr); flex: none; }
.dock .nm { display: none; }

/* banner */
.banner { position: absolute; top: 50px; left: 10px; right: 10px; z-index: 40; border-radius: 22px; padding: 12px 14px; display: flex; gap: 12px; align-items: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: var(--ink); box-shadow: var(--shadow); border: 0; text-align: left; width: auto; animation: drop .35s cubic-bezier(.2,.9,.3,1.2); }
.banner .tile { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; }
.banner .t { font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.banner .t span { color: var(--muted); font-weight: 500; font-size: 12px; }
.banner .b { font-size: 13px; }
.banner.pay { background: var(--marigold); color: #241600; }
.banner.pay .t span { color: #3d2a05; }
.banner.pay .amt { font-family: var(--f-display); font-weight: 800; font-stretch: 85%; font-size: 26px; line-height: 1.05; }
@keyframes drop { from { transform: translateY(-120%); opacity: 0; } to { transform: none; opacity: 1; } }

/* ── App chrome ─────────────────────────────────────────── */
.app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); animation: open .22s ease-out; }
@keyframes open { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .app, .banner, .sheet, .toast { animation: none !important; } }
.app-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 2px 12px 10px; }
.app-head .back { background: none; border: 0; display: inline-flex; align-items: center; gap: 2px; color: var(--teal); font-weight: 600; padding: 6px 4px; }
.app-head h2 { margin: 0; font-family: var(--f-display); font-weight: 750; font-stretch: 85%; font-size: 22px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.005em; }
.app-head .bal { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.2; }
.app-head .bal b { display: block; color: var(--ink); font-size: 13px; }
.app-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; flex: none; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.section-t { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin: 4px 0 -6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.box { background: var(--surface-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.box.outline { background: var(--surface); border: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .grow .t { font-weight: 600; overflow-wrap: anywhere; display: block; }
.opt .t, .opt .s, .ncard .b, .banner .b, .rung .grow .t { display: block; }
.row .grow .s { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; display: block; }
.legs { display: flex; flex-direction: column; gap: 3px; margin-top: 3px; }
.legs span { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.li { padding: 11px 0; }
button.li { background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.list > button.li:first-child { border-top: 0; }
.amt-neg { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.amt-pos { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--green); }
.amt-fail { font-family: var(--f-mono); color: var(--muted); text-decoration: line-through; }
.btn { border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 700; background: var(--teal); color: var(--teal-ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.sec { background: var(--surface-3); color: var(--ink); }
.btn.ghost { background: none; color: var(--teal); padding: 8px; }
.btn.warn { background: var(--coral); color: #fff; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.st-VERIFIED { background: var(--green-soft); color: var(--green); }
.st-ESTIMATED { background: var(--amber-soft); color: var(--amber-ink); }
.st-ILLUSTRATIVE { background: var(--violet-soft); color: var(--violet-ink); }
.st-UNAVAILABLE { background: var(--grey-soft); color: var(--grey-ink); }
.p-ok { background: var(--green-soft); color: var(--green); }
.p-warn { background: var(--coral-soft); color: var(--coral); }
.p-due { background: var(--amber-soft); color: var(--amber-ink); }
.p-muted { background: var(--grey-soft); color: var(--grey-ink); }
.hero { border-radius: 20px; padding: 18px; background: var(--teal); color: var(--teal-ink); display: flex; flex-direction: column; gap: 4px; }
.hero .lbl { font-size: 12px; opacity: .85; font-weight: 600; }
.hero .big { font-family: var(--f-display); font-weight: 800; font-stretch: 80%; font-size: 40px; line-height: 1; letter-spacing: -.01em; }
.hero .split { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; }
.hero .split b { display: block; font-family: var(--f-mono); font-size: 14px; font-weight: 600; }
.bar { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 4px; }
.bar.warm i { background: var(--marigold); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lab { font-size: 12px; font-weight: 700; color: var(--muted); }
.inp { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 0 12px; }
.search input { border: 0; background: none; padding: 10px 0; flex: 1; min-width: 0; outline: none; }
.seg { display: flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
input[type=range] { width: 100%; accent-color: var(--teal); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--surface-3); border: 0; position: relative; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw.on { background: var(--teal); }
.sw.on::after { transform: translateX(18px); }

/* store */
.pantry { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pantry div { background: var(--surface-2); border-radius: 12px; padding: 8px 6px; text-align: center; font-size: 11px; color: var(--muted); }
.pantry b { display: block; font-family: var(--f-mono); color: var(--ink); font-size: 16px; }
.pantry .bad b { color: var(--coral); }
.tier-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 2px; }
.tier-h h3 { margin: 0; font-size: 14px; font-family: var(--f-display); font-weight: 750; font-stretch: 90%; }

/*
 * money.js — integer money helpers.
 * All amounts in the game are stored as integer minor units.
 * IDR has an ISO 4217 exponent of 2 (sen), and some wage decrees carry sen
 * (e.g. UMP Banten Rp3.100.881,40), so 1 rupiah = 100 units.
 */
(function (root) {

  function toMinor(major, currency = 'IDR') {

      status: 'ESTIMATED', sourceId: 'game_rent_model', note: lab('Tanpa perabot. Banyak pemilik meminta beberapa bulan di muka; di game ini satu bulan sebagai deposit.', 'Unfurnished. Many landlords ask for several months up front; this game asks for one month as deposit.') }));
    if (RENT.apartment[t]) RENT.apartment[t].forEach((v, i) => opts.push({ id: `apartment_${TIERS[i]}`, type: 'apartment', tier: TIERS[i], label: lab('Apartemen studio', 'Studio apartment'),
      monthlyRent: rp(v), deposit: rp(v), includes: { electricity: false, water: false, internet: false }, furnished: true, bathroom: lab('Dalam', 'Private'), ac: true, fridge: i > 0,
      status: 'ESTIMATED', sourceId: 'game_rent_model', note: lab('Biaya IPL diasumsikan sudah termasuk sewa.', 'Service charge (IPL) assumed inside the rent.') }));
    if (hh) {
      const mem = members({ household: hh });
      for (const o of opts) {
        const [maxA, maxK] = CAPACITY[o.type];
        o.fits = mem.adults <= maxA && mem.kids <= maxK;
        o.capacity = CAPACITY[o.type][2];
      }
    }
    for (const o of opts) o.capacity = CAPACITY[o.type][2];
    return opts;
  }
  const getHousing = (cityId, housingId) => housingOptions(cityId).find((h) => h.id === housingId) || null;
  const curHousing = (state) => getHousing(state.config.cityId, state.config.housingId);
  function calculateMonthlyRent(config) {
    const h = getHousing(config.cityId, config.housingId);
    if (!h) return 0;
    return h.type === 'family' ? config.familyContribution ?? h.contributionDefault : h.monthlyRent;
  }
  function planMove(state, housingId) {
    const h = housingOptions(state.config.cityId, state.config.household).find((x) => x.id === housingId);
    if (!h) return { ok: false, error: 'unknown_housing' };
    if (h.fits === false) return { ok: false, error: 'too_small' };
    state.pendingMove = housingId === state.config.housingId ? null : housingId;
    return { ok: true };
  }
  Object.assign(E, { housingOptions, getHousing, curHousing, calculateMonthlyRent, planMove, CAPACITY });

  // ── electricity & utilities ─────────────────────────────────────────
  const TARIFFS = {
    '450s': { label: 'R-1/TR 450 VA (subsidi)', major: '415', subsidised: true },
    '900s': { label: 'R-1/TR 900 VA (subsidi)', major: '605', subsidised: true },
    '900': { label: 'R-1/TR 900 VA RTM', major: '1352' },
    '1300': { label: 'R-1/TR 1.300 VA', major: '1444.70' },
    '2200': { label: 'R-1/TR 2.200 VA', major: '1444.70' },
  };
  const KWH = { ac: { none: 0, occasional: 24, nightly: 96, heavy: 168 }, fridge: 30, cooking: 25, washer: { none: 0, shared: 4, private: 8 }, tv: 10, fan: 8 };
  const ADMIN_FEE = rp(2500);
  const TOKEN_NOMINALS = [20000, 50000, 100000, 200000, 500000].map(rp);
  const WATER_BILL_DEFAULT = rp(70000);
  const defaultElectricity = () => ({ tariff: '900', ac: 'none', electricCooking: false, washer: 'shared', tv: false, meter: 'prepaid' });

  /** Owned appliances come from state.owned; profile choices from config.electricity. */
  function electricityProfile(state) {
    const c = state.config.electricity;
    const o = (state.owned && state.owned.items) || {};
    return { ...c, fridge: !!o.fridge, fan: !!o.fan, electricCooking: !!(c.electricCooking && o.ricecooker), occupants: members(state).people };
  }
  function estimateElectricity(profile, ppjBp = 300) {
    const lines = [];
    const base = 25 + 5 * Math.max(0, (profile.occupants || 1) - 1);
    lines.push([bi('Lampu, kipas kecil, isi daya ponsel & laptop', 'Lights, small fan, phone and laptop charging'), base]);
    if (KWH.ac[profile.ac]) lines.push([bi(`AC (${profile.ac})`, `Air conditioner (${profile.ac})`), KWH.ac[profile.ac]]);
    if (profile.fridge) lines.push([bi('Kulkas kecil', 'Small refrigerator'), KWH.fridge]);
    if (profile.fan) lines.push([bi('Kipas angin berdiri', 'Standing fan'), KWH.fan]);
    if (profile.electricCooking) lines.push([bi('Rice cooker & ketel listrik', 'Rice cooker and electric kettle'), KWH.cooking]);
    if (KWH.washer[profile.washer]) lines.push([bi(`Mesin cuci (${profile.washer})`, `Washing machine (${profile.washer})`), KWH.washer[profile.washer]]);
    if (profile.tv) lines.push([bi('Televisi', 'Television'), KWH.tv]);
    const kwh = lines.reduce((s, l) => s + l[1], 0);
    const tariff = TARIFFS[profile.tariff] || TARIFFS['900'];
    const tariffMinor = M.toMinor(tariff.major);
    const energy = Math.round(kwh * tariffMinor);
    const ppj = M.applyBasisPoints(energy, ppjBp);
    return { kwh, lines, tariffKey: profile.tariff, tariffLabel: tariff.label, tariffMinor, energy, ppj, admin: ADMIN_FEE, total: energy + ppj + ADMIN_FEE, dailyKwh: kwh / 30, status: 'ESTIMATED', sourceId: 'pln_2026' };
  }
  function tokenBreakdown(nominalMinor, tariffKey, ppjBp = 300) {
    const tariffMinor = M.toMinor((TARIFFS[tariffKey] || TARIFFS['900']).major);
    const afterAdmin = Math.max(0, nominalMinor - ADMIN_FEE);
    const energyValue = Math.round((afterAdmin * 10000) / (10000 + ppjBp));
    const ppj = afterAdmin - energyValue;
    return { nominal: nominalMinor, admin: ADMIN_FEE, ppj, energyValue, kwh: energyValue / tariffMinor, tariffMinor };
  }
  Object.assign(E, { TARIFFS, TOKEN_NOMINALS, ADMIN_FEE, defaultElectricity, electricityProfile, estimateElectricity, tokenBreakdown });

  // ── pricing ─────────────────────────────────────────────────────────
  function priceOf(item, config) {
    const adj = (config && config.priceAdjustBp) || 0;
    if (!adj) return item.price;
    return M.roundTo(item.price + M.applyBasisPoints(item.price, adj), rp(100));
  }
  const priceStatus = (item, config) => ((config && config.priceAdjustBp) && item.status === 'VERIFIED' ? 'ESTIMATED' : item.status);
  Object.assign(E, { priceOf, priceStatus });

  // ── transactions & notifications ────────────────────────────────────
  const stamp = (state) => ({ month: state.monthIndex, day: state.date.day, y: state.date.year, m: state.date.month, abs: today(state) });
  function pushTx(state, tx) {
    const full = { id: 'tx' + state.seq++, ...stamp(state), currency: 'IDR', status: 'completed', items: null, split: null, note: null, ...tx };
    full.balanceAfter = state.wallet;
    state.transactions.unshift(full);
    if (state.transactions.length > 1500) state.transactions.length = 1500;
    return full;
  }
  /**
   * The single debit path. Validates, then either deducts and records a completed
   * transaction, or records a failed attempt and deducts nothing.
   */
  function chargeOrFail(state, { merchant, category, cls, amount, note, items, split, quiet }) {
    if (!Number.isInteger(amount) || amount < 0) return { ok: false, error: 'invalid_amount' };
    if (amount > state.wallet) {
      const tx = pushTx(state, { merchant, category, cls, amount: -amount, status: 'failed', note: [note, bi('Ditolak: saldo tidak cukup', 'Declined: not enough balance')].filter(Boolean), items, split });
      if (!quiet) notify(state, 'bank', bi('Pembayaran ditolak', 'Payment declined'), bi(`${RLS.i18n.L(merchant)}: ${M.format(amount)}. Saldo kamu ${M.format(state.wallet)}.`, `${(merchant && merchant.en) || merchant}: ${M.format(amount)}. Your balance is ${M.format(state.wallet)}.`), 'warn');
      if (E.moodOnDeclined) E.moodOnDeclined(state);
      return { ok: false, error: 'insufficient_funds', tx, shortBy: amount - state.wallet };
    }
    state.wallet -= amount;
    return { ok: true, tx: pushTx(state, { merchant, category, cls, amount: -amount, note, items, split }) };
  }
  function credit(state, { merchant, category, cls, amount, note, split }) {
    state.wallet += amount;
    return pushTx(state, { merchant, category, cls, amount, note, split });
  }
  function notify(state, app, title, body, tone = 'info', extra = {}) {
    state.notifications.unshift({ id: 'n' + state.seq++, app, title, body, tone, ...stamp(state), read: false, ...extra });
    if (state.notifications.length > 150) state.notifications.length = 150;
  }
  const CAT = {
    salary: bi('Gaji', 'Salary'), housing: bi('Tempat tinggal', 'Housing'), utilities: bi('Utilitas', 'Utilities'), transport: bi('Transportasi', 'Transport'),
    groceries: bi('Belanja dapur', 'Groceries'), food: bi('Makan di luar & antar', 'Eating out & delivery'), shopping: bi('Belanja', 'Shopping'), beauty: bi('Perawatan diri', 'Personal care'),
    health: bi('Kesehatan', 'Health'), leisure: bi('Hiburan', 'Leisure'), phone: bi('Ponsel & internet', 'Phone & internet'), subs: bi('Langganan', 'Subscriptions'),
    savings: bi('Tabungan', 'Savings'), unexpected: bi('Tak terduga', 'Unexpected'), extra: bi('Pendapatan tambahan', 'Extra income'), family: bi('Keluarga', 'Family'),
    loan: bi('Pinjaman', 'Loans'), docs: bi('Dokumen & administrasi', 'Documents & admin'), travel: bi('Perjalanan', 'Travel'), work: bi('Kerja', 'Work'), refund: bi('Pengembalian dana', 'Refund'),
    benefit: bi('Jaminan sosial', 'Social security'), household: bi('Pendapatan rumah tangga', 'Household income'),
  };
  Object.assign(E, { pushTx, chargeOrFail, credit, notify, CAT, stamp });

  // ── bills ──────────────────────────────────────────────────────────
  function addBill(state, b) {
    const bill = { id: `${state.monthIndex}-${b.key}`, month: state.monthIndex, status: 'pending', autopay: false, paidDay: null, mandatory: true, adjustable: false, ...b };
    if (state.bills.some((x) => x.id === bill.id)) return null; // never create the same bill twice
    state.bills.push(bill);
    return bill;
  }
  const billsThisMonth = (state) => state.bills.filter((b) => b.month === state.monthIndex);

  function generateMonthlyBills(state) {
    const c = state.config;
    const h = curHousing(state);
    const hh = household(state);
    const mem = members(state);
    if (h.type === 'family') {
      if (c.familyContribution > 0) addBill(state, { key: 'family', label: bi('Kontribusi untuk rumah keluarga', 'Contribution to the family household'), category: 'housing', amount: c.familyContribution, dueDay: 5, adjustable: true });
    } else addBill(state, { key: 'rent', label: bi(`Sewa — ${h.label.id}`, `Rent — ${h.label.en}`), category: 'housing', amount: h.monthlyRent, dueDay: 5 });
    if (!h.includes.electricity && c.electricity.meter === 'postpaid') {
      const est = estimateElectricity(electricityProfile(state), c.ppjBp);
      const kwh = state.electricity.lastMonthKwh ?? est.kwh;
      const energy = Math.round(kwh * est.tariffMinor);
      addBill(state, { key: 'electricity', label: bi(`PLN pascabayar (${Math.round(kwh)} kWh)`, `PLN postpaid (${Math.round(kwh)} kWh)`), category: 'utilities', amount: energy + M.applyBasisPoints(energy, c.ppjBp) + ADMIN_FEE, dueDay: 20 });
    }
    if (!h.includes.water) addBill(state, { key: 'water', label: bi('Air PDAM', 'Water utility (PDAM)'), category: 'utilities', amount: c.waterBill + Math.max(0, mem.people - 1) * rp(20000), dueDay: 20, adjustable: true });
    if (state.homeInternet && !h.includes.internet) {
      const plan = D().connect.homeInternet.find((x) => x.id === state.homeInternet);
      if (plan) addBill(state, { key: 'internet', label: plan.name, category: 'phone', amount: plan.price, dueDay: 20, adjustable: true });
    }
    if (!E.hasJknViaWork || !E.hasJknViaWork(state)) {
      if (c.jknMandiri) addBill(state, { key: 'jkn', label: bi(`BPJS Kesehatan mandiri kelas 3 (${mem.people} orang)`, `BPJS Kesehatan, independent class 3 (${mem.people} people)`), category: 'health', amount: rp(35000) * mem.people, dueDay: 10, adjustable: true });
    }
    const plan = E.currentCommutePlan ? E.currentCommutePlan(state) : null;
    if (plan && plan.monthlyFixed) addBill(state, { key: 'motorcycle', label: bi('Pajak & servis motor' + (c.motorcycleCredit ? ' + cicilan' : ''), 'Motorcycle tax & servicing' + (c.motorcycleCredit ? ' + instalment' : '')), category: 'transport', amount: plan.monthlyFixed, dueDay: 15 });
    // family costs (ILLUSTRATIVE)
    const { city } = getLocality(c.cityId);
    const schoolCost = { 6: 200000, 12: 300000, 15: 400000 };
    hh.children.forEach((k, i) => {
      if (k.age >= 6 && k.age <= 17) {
        const base = k.age <= 12 ? schoolCost[6] : k.age <= 15 ? schoolCost[12] : schoolCost[15];
        addBill(state, { key: `school-${i}`, label: bi(`Kebutuhan sekolah anak ${i + 1} (seragam, buku, uang jajan, antar-jemput)`, `School costs for child ${i + 1} (uniform, books, pocket money, transport)`), category: 'family', amount: rp(base), dueDay: 3, adjustable: true,
          note: bi('SPP sekolah negeri umumnya gratis; ini biaya lain-lain (ilustratif).', 'Public school tuition is generally free; these are the other costs (illustrative).') });
      }
      if (k.age < 6 && hh.childcare === 'daycare') {
        const care = { A: 1500000, B: 1200000, C: 900000, D: 700000 }[city.tier];
        addBill(state, { key: `childcare-${i}`, label: bi(`Penitipan anak ${i + 1}`, `Childcare for child ${i + 1}`), category: 'family', amount: rp(care), dueDay: 3, adjustable: true });
      }
    });
    if (hh.children.some((k) => k.age < 6) && hh.childcare === 'family') addBill(state, { key: 'childcare-thanks', label: bi('Uang terima kasih untuk keluarga yang menjaga anak', 'Thank-you money for family minding the children'), category: 'family', amount: rp(250000), dueDay: 3, adjustable: true });
    if (hh.supportParents > 0) addBill(state, { key: 'parents', label: bi('Kirim uang untuk orang tua', 'Money for your parents'), category: 'family', amount: hh.supportParents, dueDay: 5, adjustable: true });
    if (E.loanBillsForMonth) E.loanBillsForMonth(state);
    // carry unpaid bills from last month as arrears
    for (const old of state.bills.filter((b) => b.month === state.monthIndex - 1 && b.status !== 'paid' && !b.carried)) {
      old.carried = true;
      if (old.loanId) continue; // loan arrears are tracked by the loan itself
      const late = old.key === 'rent' || old.key === 'electricity' ? rp(50000) : 0;
      addBill(state, { key: 'arrears-' + old.key, label: bi(`Tunggakan bulan lalu: ${RLS.i18n.L(old.label)}`, `Overdue from last month: ${old.label.en || old.label}`), category: old.category, amount: old.amount + late, lateFee: late, dueDay: 1, arrears: true });
    }
  }

  function processBillPayment(state, billId, opts = {}) {
    const bill = state.bills.find((b) => b.id === billId);
    if (!bill) return { ok: false, error: 'unknown_bill' };
    if (bill.status === 'paid') return { ok: false, error: 'already_paid' };
    if (bill.month < state.monthIndex && bill.carried && !bill.loanId) return { ok: false, error: 'carried_forward' };
    const split = bill.loanId ? { principal: bill.principal, interest: bill.amount - bill.principal } : null;
    const res = chargeOrFail(state, { merchant: bill.label, category: bill.category, cls: bill.loanId ? 'loan_repay' : 'mandatory', amount: bill.amount, note: bi(`Tagihan jatuh tempo tgl ${bill.dueDay}`, `Bill due on day ${bill.dueDay}`), split, quiet: opts.quiet });
    if (!res.ok) return res;
    bill.status = 'paid';
    bill.paidDay = state.date.day;
    if (bill.loanId && E.onLoanBillPaid) E.onLoanBillPaid(state, bill);
    if (E.moodOnBillPaid) E.moodOnBillPaid(state, bill);
    return { ok: true, tx: res.tx };
  }
  function setAutopay(state, billId, on) {
    const bill = state.bills.find((b) => b.id === billId);
    if (bill && !bill.forcedAutopay) bill.autopay = !!on;
  }
  function unpaidBillsTotal(state) { return billsThisMonth(state).filter((b) => b.status !== 'paid').reduce((s, b) => s + b.amount, 0); }
  Object.assign(E, { addBill, billsThisMonth, generateMonthlyBills, processBillPayment, setAutopay, unpaidBillsTotal });

  // ── utilities actions ───────────────────────────────────────────────
  function buyToken(state, nominalMinor) {
    const c = state.config;
    const h = curHousing(state);
    if (h.includes.electricity) return { ok: false, error: 'included_in_rent' };
    if (c.electricity.meter !== 'prepaid') return { ok: false, error: 'postpaid_meter' };
    const b = tokenBreakdown(nominalMinor, c.electricity.tariff, c.ppjBp);
    const res = chargeOrFail(state, { merchant: bi('Token listrik PLN', 'PLN prepaid token'), category: 'utilities', cls: 'essential', amount: nominalMinor, note: bi(`${b.kwh.toFixed(1)} kWh setelah biaya admin & PPJ`, `${b.kwh.toFixed(1)} kWh after admin fee and PPJ`) });
    if (!res.ok) return res;
    state.electricity.kwhBalance += b.kwh;
    return { ok: true, kwh: b.kwh, tx: res.tx };
  }
  function buyDataPlan(state, planId) {
    const plan = D().connect.dataPlans.find((p) => p.id === planId);
    if (!plan) return { ok: false, error: 'unknown_plan' };
    const res = chargeOrFail(state, { merchant: bi('Paket data seluler', 'Mobile data'), category: 'phone', cls: 'essential', amount: plan.price, note: plan.name });
    if (!res.ok) return res;
    const base = state.dataPlanUntil && dayNumber(state.dataPlanUntil) >= today(state) ? state.dataPlanUntil : state.date;
    state.dataPlanUntil = addDays(base, plan.days);
    return { ok: true, tx: res.tx };
  }
  function repairPhone(state, deviceId) {
    const dev = D().connect.devices.find((p) => p.id === deviceId);
    if (!dev) return { ok: false, error: 'unknown_device' };
    const res = chargeOrFail(state, { merchant: bi('Konter HP', 'Phone counter'), category: 'phone', cls: 'essential', amount: dev.price, note: dev.name });
    if (res.ok) state.owned.phoneCondition = Math.max(state.owned.phoneCondition, 85);
    return res;
  }
  function setHomeInternet(state, planId) {
    state.homeInternet = planId || null;
    if (planId) {
      const plan = D().connect.homeInternet.find((x) => x.id === planId);
      if (plan && !billsThisMonth(state).some((b) => b.key === 'internet')) addBill(state, { key: 'internet', label: plan.name, category: 'phone', amount: plan.price, dueDay: Math.min(daysInMonth(state.date.year, state.date.month), state.date.day + 2), adjustable: true });
    }
  }
  function hasWifi(state) {
    const h = curHousing(state);
    if (h.includes.internet) return true;
    if (!state.homeInternet) return false;
    const bill = state.bills.find((b) => b.key === 'internet' && b.month === state.monthIndex);
    return !bill || bill.status === 'paid' || state.date.day <= bill.dueDay;
  }
  const hasMobileData = (state) => !!state.dataPlanUntil && dayNumber(state.dataPlanUntil) >= today(state);
  const isOnline = (state) => (hasWifi(state) || hasMobileData(state)) && state.owned.phoneCondition > 0;
  function electricityOn(state) {
    const h = curHousing(state);
    if (h.includes.electricity) return true;
    if (state.config.electricity.meter === 'postpaid') {
      const overdue = state.bills.find((b) => (b.key === 'electricity' || b.key === 'arrears-electricity') && b.status !== 'paid' && b.month === state.monthIndex && b.arrears && state.date.day > 10);
      return !overdue;
    }
    return state.electricity.kwhBalance > 0;
  }
  Object.assign(E, { buyToken, buyDataPlan, repairPhone, setHomeInternet, hasWifi, hasMobileData, isOnline, electricityOn, WATER_BILL_DEFAULT });

  // ── subscriptions ───────────────────────────────────────────────────
  function subscribe(state, subId) {
    const sub = D().subscriptions.find((s) => s.id === subId);
    if (!sub || state.subscriptions.some((s) => s.id === subId && s.active)) return { ok: false, error: 'invalid' };
    const res = chargeOrFail(state, { merchant: sub.name, category: 'subs', cls: 'discretionary', amount: sub.price, note: bi('Bulan pertama', 'First month') });
    if (!res.ok) return res;
    const existing = state.subscriptions.find((s) => s.id === subId);
    const renewDay = Math.min(state.date.day, 28);
    if (existing) Object.assign(existing, { active: true, renewDay, lastChargedMonth: state.monthIndex });
    else state.subscriptions.push({ id: subId, active: true, renewDay, lastChargedMonth: state.monthIndex });
    if (E.applyMood) E.applyMood(state, sub.mood);
    state.counters.optionalBought++;
    return { ok: true, tx: res.tx };
  }
  function cancelSubscription(state, subId) { const s = state.subscriptions.find((x) => x.id === subId); if (s) s.active = false; }
  Object.assign(E, { subscribe, cancelSubscription });

  // ── savings ─────────────────────────────────────────────────────────
  function processSavingsTransfer(state, amount, direction = 'in', goalId = 'emergency') {
    if (!Number.isInteger(amount) || amount <= 0) return { ok: false, error: 'invalid_amount' };
    const goal = state.goals.find((g) => g.id === goalId);
    if (!goal) return { ok: false, error: 'unknown_goal' };
    if (direction === 'in') {
      if (amount > state.wallet) return { ok: false, error: 'insufficient_funds' };
      state.wallet -= amount; state.savings += amount; goal.saved += amount;
      return { ok: true, tx: pushTx(state, { merchant: bi(`FutureMe · ${goal.name.id || goal.name}`, `FutureMe · ${goal.name.en || goal.name}`), category: 'savings', cls: 'savings_in', amount: -amount, note: bi('Pindah ke tabungan (bukan pengeluaran)', 'Transfer to savings (not spending)') }) };
    }
    if (amount > goal.saved) return { ok: false, error: 'insufficient_savings' };
    goal.saved -= amount; state.savings -= amount; state.wallet += amount;
    return { ok: true, tx: pushTx(state, { merchant: bi(`FutureMe · ${goal.name.id || goal.name}`, `FutureMe · ${goal.name.en || goal.name}`), category: 'savings', cls: 'savings_out', amount, note: bi('Tarik dari tabungan (bukan pendapatan)', 'Withdrawal from savings (not income)') }) };
  }
  function addGoal(state, name, targetMinor, kind = 'custom') {
    const id = 'g' + state.seq++;
    state.goals.push({ id, name, target: targetMinor, saved: 0, kind });
    return id;
  }
  Object.assign(E, { processSavingsTransfer, addGoal });

  // ── config, character, creation ─────────────────────────────────────
  function defaultCharacter() {
    return { age: 23, gender: 'female', menstruates: true, education: 'sma', experienceYears: 0, skills: ['customer'], certs: [], english: 'basic', otherLang: 'regional', digital: 'intermediate' };
  }
  function defaultConfig(overrides = {}) {
    const base = {
      countryId: 'id', provinceId: 'banten', cityId: 'tangsel',
      scenario: 'formal', wageTreatment: 'net', workweek: 5, distanceKm: 12,
      housingId: 'kost_typical', depositPaid: true, familyContribution: rp(500000),
      difficulty: 'normal', priceAdjustBp: 0, ppjBp: 300,
      electricity: defaultElectricity(), waterBill: WATER_BILL_DEFAULT,
      commutePlanId: null, ride: { provider: 'gesit', tier: 'standard' }, fareLevel: 'mid', customBusFare: null, motorcycleCredit: false,
      jknMandiri: false, groceryBudget: rp(1000000), startYear: 2026, startMonth: 10,
      character: defaultCharacter(), household: defaultHousehold(),
      startEmployed: true, startJobId: 'retail', tenureMonths: 4, startingSavings: rp(0),
      passport: { has: false, type: 'e10', yearsLeft: 6 }, ownsFridge: false, ownsRiceCooker: true, ownsFan: true,

      if (amt > 0) E.credit(state, { merchant: bi('Pasangan', 'Partner'), category: 'household', cls: 'income_household', amount: amt, note: hh.sharedIncome ? bi('Penghasilan pasangan masuk dompet bersama', 'Partner\'s income into the shared wallet') : bi('Kontribusi pasangan untuk rumah tangga', 'Partner\'s household contribution') });
    }

    if (!isEmployed(state) && jkp.eligible && jkp.applied && jkp.paid < 6) {

      if (searched) {
        const amt = Math.round(Math.min(jkp.wage, rp(5000000)) * 0.6);
        E.credit(state, { merchant: bi('BPJS Ketenagakerjaan — JKP', 'BPJS Ketenagakerjaan — JKP'), category: 'benefit', cls: 'benefit', amount: amt, note: bi(`Manfaat uang tunai JKP bulan ke-${jkp.paid + 1} dari 6`, `JKP cash benefit, month ${jkp.paid + 1} of 6`) });
        jkp.paid++;
      } else E.notify(state, 'workday', bi('JKP bulan ini tertunda', 'JKP held this month'), bi('Manfaat JKP mensyaratkan kamu aktif mencari kerja. Belum ada lamaran dalam 30 hari terakhir.', 'JKP requires an active job search. No applications in the last 30 days.'), 'warn');
    }

  }
  Object.assign(E, { payday, dailyRate });

  // ── leave, sick days, clinic ────────────────────────────────────────
  function takeLeave(state, reason, opts = {}) {
    const emp = state.employment;
    if (!isScheduledToWork(state) || state.day.leave) return { ok: false, error: 'not_working' };
    let paid = false;
    if (reason === 'sick' && opts.note && state.config.scenario === 'formal') paid = true;
    else if (reason !== 'sick' && emp.leaveBalance > 0 && !opts.unpaid) { emp.leaveBalance--; paid = true; }
    if (!paid && state.job.type !== 'harian') emp.unpaidLeave++;
    state.day.leave = { reason, paid };
    state.day.slots = Math.max(state.day.slots, 3);
    if (reason !== 'sick') state.perf.days.push({ abs: E.today(state), leave: true });
    return { ok: true, paid };
  }
  function clinicVisit(state, kind, opts = {}) {
    if (kind === 'jkn' && !hasJkn(state)) return { ok: false, error: 'no_jkn' };
    if (!state.day.leave && !E.useSlots(state, 1)) return { ok: false, error: 'no_time' };
    if (kind === 'jkn' && !opts.travelPaid) {
      const fare = E.localFare(state) * 2;
      const res = E.chargeOrFail(state, { merchant: bi('Ongkos ke faskes JKN', 'Travel to your JKN clinic'), category: 'health', cls: 'essential', amount: fare, note: bi('Periksa di faskes tingkat 1 ditanggung JKN', 'The primary-care visit itself is covered by JKN') });
      if (!res.ok) { if (!state.day.leave) state.day.used--; return res; }
    }
    const h = state.health;
    if (h.condition !== 'healthy') { h.eased = true; h.severity = 1; if (h.daysLeft > 1) h.daysLeft--; }
    state.day.sickNote = true;
    E.applyMood(state, { anxiety: -3, stress: -2 });
    return { ok: true };
  }
  Object.assign(E, { takeLeave, clinicVisit });

  // ── performance ─────────────────────────────────────────────────────
  function skillMatch(state, skills) {
    const ch = state.config.character;
    const base = 68 + Math.min(20, ch.experienceYears * 4);
    if (!skills || !skills.length) return base;
    const have = skills.filter((s) => ch.skills.includes(s)).length;
    return clamp(base - 25 + (have / skills.length) * 35, 0, 100);
  }
  function compliance(state) {
    const kind = J().KINDS[state.job.kind], a = state.appearance;
    const issues = [];
    if (kind.dress === 'office') { if (a.workwear < 30) issues.push(bi('Pakaian kerja dianggap kurang rapi', 'Work clothes considered not neat enough')); }
    if (kind.dress === 'uniform') { if (a.footwear < 30) issues.push(bi('Sepatu hitam tertutup sudah rusak', 'Closed black shoes are worn out')); if (a.grooming < 30) issues.push(bi('Aturan kerapian rambut', 'Hair and grooming rules')); }
    if (a.hygiene < 45 && kind.dress !== 'ppe') issues.push(bi('Kebersihan diri (perlengkapan mandi/cuci habis)', 'Personal hygiene (out of bathroom/laundry supplies)'));
    return issues;
  }
  function doWork(state, commute) {
    const m = state.mood, r = E.rng(state, 'work');
    const nut = E.nutritionScore(state).score;
    let focus = 84 - state.sleep.debt * 4 - Math.max(0, m.stress - 55) * 0.6 + E.focusPenalty(state) - (nut < 45 ? 12 : nut < 55 ? 5 : 0) - (state.supplies.water > 0 ? 0 : 8) + (m.energy - 50) * 0.25 - (state.distress.active ? 8 : 0) - (state.food.meals.breakfast && state.food.meals.breakfast.how === 'skip' ? 4 : 0);
    focus = clamp(Math.round(focus), 5, 100);
    const sm = skillMatch(state, state.job.skills);
    let task = clamp(Math.round(0.55 * focus + 0.25 * m.motivation + 0.2 * sm + (r() - 0.5) * 16), 0, 100);
    const issues = compliance(state);
    const late = !!(commute && commute.late);
    const score = clamp(task - (late ? 8 : 0) - (issues.length ? 5 : 0), 0, 100);
    state.perf.days.push({ abs: E.today(state), focus, task, late, issues: issues.length, score });
    if (state.perf.days.length > 40) state.perf.days.shift();
    const worked = state.perf.days.filter((d) => !d.leave).slice(-10);
    state.perf.avg = Math.round(worked.reduce((s, d) => s + d.score, 0) / Math.max(1, worked.length));
    state.todayLog.worked = true;
    if (late) { state.todayLog.late = commute.minutes; state.counters.lateDays++; }
    if (state.job.type === 'harian') E.credit(state, { merchant: state.job.company, category: 'salary', cls: 'income', amount: dailyRate(state), note: bi('Upah harian', 'Daily wage') });
    if (issues.length && r() < 0.3) E.notify(state, 'workday', bi('Teguran ringan dari atasan', 'A word from your supervisor'), bi(`Atasan menyinggung: ${issues.map((i) => i.id).join('; ')}.`, `Your supervisor mentioned: ${issues.map((i) => i.en).join('; ')}.`), 'warn');
    return { focus, task, score, late, issues };
  }
  function weeklyReview(state) {
    const days = state.perf.days.filter((d) => !d.leave && E.today(state) - d.abs < 7);
    if (!days.length) return;
    const r = E.rng(state, 'review');
    const actual = Math.round(days.reduce((s, d) => s + d.score, 0) / days.length);
    const lateN = days.filter((d) => d.late).length, issueN = days.filter((d) => d.issues).length;
    const manager = clamp(Math.round(actual + (r() - 0.5) * 20 - lateN * 3 - issueN * 2), 0, 100);
    const label = manager >= 70 ? bi('Baik', 'Good') : manager >= 50 ? bi('Cukup', 'Satisfactory') : bi('Perlu perbaikan', 'Needs improvement');
    state.perf.weeks.unshift({ abs: E.today(state), actual, manager, label, lateN, issueN });
    if (state.perf.weeks.length > 12) state.perf.weeks.length = 12;
    const emp = state.employment;
    if (manager < 45) { state.perf.badWeeks++; state.perf.goodWeeks = 0; } else { state.perf.badWeeks = 0; if (manager >= 60) state.perf.goodWeeks++; }
    E.applyMood(state, manager >= 70 ? { confidence: 4, motivation: 3 } : manager < 45 ? { confidence: -4, stress: 4, motivation: -3 } : {});
    if (state.perf.badWeeks >= 2 && emp.status === 'employed') {
      state.perf.badWeeks = 0;
      if (emp.sp >= 3) { startTermination(state, 'performance'); return; }
      emp.sp++; emp.spAbs = E.today(state);
      E.notify(state, 'workday', bi(`Surat Peringatan ${emp.sp} (SP${emp.sp})`, `Warning letter ${emp.sp} (SP${emp.sp})`), bi(`Penilaian atasan dua minggu berturut-turut rendah. Kualitas kerja aktualmu ${actual}/100, keterlambatan ${lateN} kali.`, `Two weeks of low supervisor ratings. Your actual work quality was ${actual}/100, with ${lateN} late day(s).`), 'warn');
      E.applyMood(state, { anxiety: 10, confidence: -6 });
    } else if (state.perf.goodWeeks >= 4 && emp.sp > 0) { emp.sp--; state.perf.goodWeeks = 0; E.notify(state, 'workday', bi('Peringatan dicabut', 'Warning lifted'), bi('Kinerjamu stabil; satu surat peringatan tidak berlaku lagi.', 'Your performance has been steady; one warning letter no longer applies.'), 'info'); }
    else E.notify(state, 'workday', bi('Catatan mingguan atasan', 'Weekly note from your supervisor'), bi(`Penilaian: ${label.id} (${manager}/100). Kualitas kerja aktual: ${actual}/100.`, `Rating: ${label.en} (${manager}/100). Actual work quality: ${actual}/100.`), 'info');
  }
  Object.assign(E, { doWork, weeklyReview, compliance, skillMatch });

  // ── layoffs, contract ends, severance ───────────────────────────────
  function tenureYears(state) { return state.job ? (E.today(state) - state.job.startAbs) / 365 : 0; }
  function severanceEstimate(state, reason) {
    const job = state.job, w = job.wage, yrs = tenureYears(state);
    if (job.type === 'harian' || job.type === 'freelance' || state.config.scenario !== 'formal') return { amount: 0, lines: [bi('Pekerja harian/lepas atau tanpa kontrak formal: tidak ada pesangon dalam skenario ini.', 'Casual, freelance or informal work: no severance in this scenario.')] };
    if (job.type === 'pkwt' || job.type === 'magang') {
      if (job.type === 'magang') return { amount: 0, lines: [bi('Magang tidak mendapat kompensasi.', 'Internships receive no compensation.')] };
      const months = (E.today(state) - job.startAbs) / 30.4;
      const amt = Math.round((w * Math.min(months, 60)) / 12);
      return { amount: amt, lines: [bi(`Uang kompensasi PKWT: ${months.toFixed(1)} bulan ÷ 12 × upah`, `PKWT compensation: ${months.toFixed(1)} months ÷ 12 × wage`)] };
    }
    const sched = yrs < 1 ? 1 : Math.min(9, Math.floor(yrs) + 1);
    const upmk = yrs >= 24 ? 10 : yrs >= 3 ? Math.min(8, Math.floor(yrs / 3) + 1) : 0;
    const mult = reason === 'performance' ? 0.5 : 1;
    const amt = Math.round(w * (sched * mult + upmk));
    return { amount: amt, lines: [bi(`Pesangon ${sched} × ${mult} bulan upah`, `Severance ${sched} × ${mult} months' wage`), upmk ? bi(`Uang penghargaan masa kerja ${upmk} bulan`, `Long-service pay ${upmk} months`) : null].filter(Boolean) };
  }
  const REASONS = {
    downsizing: bi('Efisiensi karyawan karena penjualan turun', 'Staff cuts after falling sales'),
    restructuring: bi('Restrukturisasi organisasi', 'Organisational restructuring'),
    project: bi('Proyek tempatmu bekerja dibatalkan klien', 'The client cancelled the project you work on'),
    closure: bi('Divisi/cabang tempatmu bekerja ditutup', 'Your department or branch is closing'),
    contract: bi('Kontrak tidak diperpanjang', 'Contract not renewed'),
    performance: bi('Pemutusan setelah SP3 dan kinerja yang belum membaik', 'Termination after SP3 and no improvement'),
    harian: bi('Tidak dipanggil lagi untuk kerja harian', 'No longer called for daily work'),
  };
  function startTermination(state, reason, lastAbs) {
    const emp = state.employment;
    if (emp.status !== 'employed') return;
    const job = state.job;
    emp.status = 'notice';
    emp.reason = reason;
    emp.lastDayAbs = lastAbs || (job.type === 'harian' ? E.today(state) : E.addWorkdays(state.config.workweek, E.today(state), 14));
    emp.severance = severanceEstimate(state, reason);
    const jkpOk = state.config.scenario === 'formal' && ['pkwt', 'pkwtt'].includes(job.type) && emp.contributionMonths >= 12;
    emp.jkpEligible = jkpOk;
    E.applyMood(state, { anxiety: 25, motivation: -18, stress: 10, happiness: -10 });
    E.queueEvent(state, 'layoff_notice', { reason, lastAbs: emp.lastDayAbs, severance: emp.severance.amount, jkp: jkpOk });
    E.notify(state, 'workday', bi('Pemberitahuan pemutusan kerja', 'Termination notice'), bi(`${REASONS[reason].id}. Hari kerja terakhir: ${E.absLabel(emp.lastDayAbs)}.`, `${REASONS[reason].en}. Last working day: ${E.absLabel(emp.lastDayAbs)}.`), 'warn');
  }
  function finishEmployment(state) {
    const emp = state.employment, job = state.job;
    const sev = emp.severance || { amount: 0 };
    if (sev.amount > 0) E.credit(state, { merchant: job.company, category: 'salary', cls: 'severance', amount: sev.amount, note: sev.lines });
    emp.history.unshift({ title: job.title, company: job.company, startAbs: job.startAbs, endAbs: E.today(state), reason: emp.reason });
    const formal = state.config.scenario === 'formal' && job.type !== 'harian';
    if (formal) {
      state.docs.items.paklaring = { status: 'ready', readyAbs: E.today(state), expiresAbs: null };
      state.benefits.jhtClaimableAbs = E.today(state) + 30;
      state.benefits.jknUntilAbs = E.today(state) + 180;
      state.benefits.jkp = { eligible: !!emp.jkpEligible, applied: false, paid: 0, lastAbs: null, wage: job.wage, deadlineAbs: E.today(state) + 180 };
    }
    state.job = null;
    emp.status = 'unemployed'; emp.since = E.today(state); emp.sp = 0;
    E.notify(state, 'workday', bi('Hari ini hari terakhirmu bekerja', 'Today was your last working day'),
      bi(`${sev.amount ? 'Kompensasi/pesangon ' + M.format(sev.amount) + ' sudah dibayar. ' : ''}${formal ? 'Paklaring tersedia di Berkas. JHT bisa diklaim setelah 1 bulan.' : ''}`, `${sev.amount ? 'Compensation/severance of ' + M.format(sev.amount) + ' has been paid. ' : ''}${formal ? 'Your paklaring is in Berkas. JHT can be claimed after 1 month.' : ''}`), 'warn');
  }
  function employmentChecks(state) {
    const emp = state.employment, today = E.today(state);
    if (emp.status === 'notice' && today > emp.lastDayAbs) { finishEmployment(state); return; }
    if (emp.status === 'notice' && emp.resigning && today > emp.lastDayAbs) { finishEmployment(state); return; }
    if (emp.status !== 'employed' || !state.job) return;
    const job = state.job;
    // contract end
    if (job.endAbs && today === job.endAbs - 14) {
      const r = E.rng(state, 'renew');
      const p = clamp(0.6 + (state.perf.avg - 60) / 100 - (state.economy - 1) * 0.35 - emp.sp * 0.15, 0.1, 0.92);
      if (r() < p) {
        job.endAbs += Math.round((job.termMonths || 12) * 30.4);
        E.notify(state, 'workday', bi('Kontrak diperpanjang', 'Contract renewed'), bi(`Kontrakmu diperpanjang hingga ${E.absLabel(job.endAbs)}.`, `Your contract was extended to ${E.absLabel(job.endAbs)}.`), 'info');
        E.applyMood(state, { anxiety: -12, motivation: 6, confidence: 4 });
      } else startTermination(state, 'contract', job.endAbs);
      return;
    }
    // weekly structural risk (Mondays)
    if (E.weekday(state.date.year, state.date.month, state.date.day) !== 1) return;
    const r = E.rng(state, 'layoff');
    const hazard = (0.002 + (1 - job.stability) * 0.011) * state.economy + (emp.sp >= 2 ? 0.008 : 0);
    const x = r();
    if (x < hazard) {
      const reasons = job.type === 'harian' ? ['harian'] : ['downsizing', 'restructuring', 'closure'].concat(job.type === 'pkwt' ? ['project'] : []);
      startTermination(state, E.pick(r, reasons));
    } else if (x < hazard * 2.2 && !job.reducedHours && job.type !== 'harian') {
      job.reducedHours = { pct: E.pick(r, [0.2, 0.25, 0.3]), months: E.rint(r, 1, 2) };
      E.notify(state, 'workday', bi('Pengurangan jam kerja', 'Reduced working hours'), bi(`Perusahaan mengurangi jam kerja (skenario fiktif). Gaji bulan depan dipotong ${Math.round(job.reducedHours.pct * 100)}% selama ${job.reducedHours.months} bulan.`, `The company is cutting hours (fictional scenario). Next month's pay is ${Math.round(job.reducedHours.pct * 100)}% lower for ${job.reducedHours.months} month(s).`), 'warn');
      E.applyMood(state, { anxiety: 12, motivation: -6 });
    }
  }
  function claimJht(state) {
    const b = state.benefits;
    if (b.jhtClaimed || !b.jhtClaimableAbs || E.today(state) < b.jhtClaimableAbs || b.jht <= 0) return { ok: false, error: 'not_claimable' };
    if (!state.docs.items.paklaring) return { ok: false, error: 'needs_paklaring' };
    const amt = b.jht;
    E.credit(state, { merchant: bi('BPJS Ketenagakerjaan — JHT', 'BPJS Ketenagakerjaan — JHT'), category: 'benefit', cls: 'benefit', amount: amt, note: bi('Saldo Jaminan Hari Tua dicairkan', 'Old-age savings (JHT) paid out') });
    b.jht = 0; b.jhtClaimed = true;
    return { ok: true, amount: amt };
  }
  function applyJkp(state) {
    const j = state.benefits.jkp;
    if (!j.eligible || j.applied || isEmployed(state) || E.today(state) > (j.deadlineAbs || 0)) return { ok: false, error: 'not_eligible' };
    j.applied = true;
    return { ok: true };
  }
  function monthlyEconomy(state) {
    const r = E.rng(state, 'economy');
    state.economy = clamp(Math.round((state.economy + (r() - 0.45) * 0.25) * 100) / 100, 0.7, 1.6);
  }
  Object.assign(E, { severanceEstimate, startTermination, finishEmployment, employmentChecks, claimJht, applyJkp, monthlyEconomy, REASONS, tenureYears });

  // ── Appy: listings ──────────────────────────────────────────────────
  function refreshListings(state) {
    const a = state.appy, today = E.today(state);
    if (a.lastRefresh === today) return;
    a.lastRefresh = today;
    a.listings = a.listings.filter((l) => l.deadlineAbs >= today);
    const r = E.rng(state, 'listings');
    const { city } = E.getLocality(state.config.cityId);
    const n = E.rint(r, state.economy > 1.25 ? 1 : 2, state.economy > 1.25 ? 3 : 5) + (a.listings.length < 4 ? 2 : 0);
    const techOk = city.tier === 'A' || city.tier === 'B';
    const pool = J().ROLES.filter((t) => techOk || t.sector !== 'technology' || r() < 0.3);
    for (let i = 0; i < n; i++) {
      const t = E.pick(r, pool);
      const company = companyName(r);
      if (a.listings.some((l) => l.roleId === t.id && L(l.company) === L(company))) continue;
      a.listings.push(makeListing(state, t, company, r));
    }
    // keep the board readable: at most 14 open listings (saved or applied ones stay)
    const keep = new Set([...(a.saved || []), ...a.applications.map((x) => x.listingId)]);
    if (a.listings.length > 14) { const extra = a.listings.filter((l) => !keep.has(l.id)).sort((x, y) => x.postedAbs - y.postedAbs).slice(0, a.listings.length - 14).map((l) => l.id); a.listings = a.listings.filter((l) => !extra.includes(l.id)); }
    // gigs
    a.gigs = J().GIGS.filter(() => r() < 0.4).slice(0, 3).map((g) => ({ ...g, abs: today, pay: rp(g.pay), cost: g.cost ? rp(g.cost) : 0 }));
  }
  function makeListing(state, t, company, r) {
    const ump = E.resolveWage(state.config.cityId).amount;
    const unrealistic = t.unrealistic || r() < 0.08;
    const expReq = unrealistic ? Math.max(t.exp[0], 2) : t.exp[0];
    const type = E.pick(r, t.types);
    const arrangement = t.kind === 'desk' && r() < 0.12 ? 'remote' : t.kind === 'desk' && r() < 0.2 ? 'hybrid' : 'onsite';
    const hidden = r() < 0.25;
    return {
      id: 'L' + state.seq++, roleId: t.id, title: t.title, company, sector: t.sector, kind: t.kind, type, termMonths: type === 'pkwt' ? E.pick(r, [6, 12, 12]) : type === 'magang' ? 6 : 0,
      pay: hidden ? null : [Math.round(ump * t.pay[0] / rp(50000)) * rp(50000), Math.round(ump * t.pay[1] / rp(50000)) * rp(50000)], payMult: t.pay,
      distanceKm: arrangement === 'remote' ? 0 : E.rint(r, 3, 32), arrangement, edu: t.edu, eduVoc: !!t.eduVoc, exp: [expReq, Math.max(expReq, t.exp[1])], unrealistic: unrealistic && t.exp[0] < expReq || !!t.unrealistic,
      skills: t.skills || [], pref: t.pref || [], english: t.english || [0, 0], certs: t.certs || [], docs: t.docs || ['cv'], digital: t.digital || 1, agePref: t.agePref || null, ownBike: !!t.ownBike,

  }
  /** Mandatory requirements must all pass; preferred ones only change the odds. */
  function eligibility(state, listing) {
    const ch = state.config.character;
    const mand = [], pref = [];
    const er = eduRank(ch.education);
    const eduLabel = (J().EDUCATION.find((e) => e.rank >= listing.edu) || J().EDUCATION[0]).label;
    mand.push({ key: 'edu', label: bi(`Pendidikan minimal ${eduLabel.id}`, `At least ${eduLabel.en}`), ok: er >= listing.edu });
    if (listing.exp[0] > 0) mand.push({ key: 'exp', label: bi(`Pengalaman ${listing.exp[0]} tahun`, `${listing.exp[0]} year(s) of experience`), ok: ch.experienceYears >= listing.exp[0] });
    for (const s of listing.skills) mand.push({ key: 'skill:' + s, label: bi(`Keahlian: ${J().skillLabel[s].id}`, `Skill: ${J().skillLabel[s].en}`), ok: ch.skills.includes(s), fix: 'course' });
    if (listing.english[0] > 0) mand.push({ key: 'english', label: bi(`Bahasa Inggris ${J().ENGLISH[listing.english[0]].label.id}`, `English: ${J().ENGLISH[listing.english[0]].label.en}`), ok: engRank(ch.english) >= listing.english[0], fix: 'english' });
    for (const c of listing.certs) mand.push({ key: 'cert:' + c, label: bi(`Sertifikat: ${J().certLabel[c].id}`, `Certificate: ${J().certLabel[c].en}`), ok: ch.certs.includes(c) });
    for (const d of listing.docs) {
      const st = E.docStatus(state, d);
      mand.push({ key: 'doc:' + d, label: bi(`Dokumen: ${D().travel.docById[d].name.id}`, `Document: ${D().travel.docById[d].name.en}`), ok: st.valid, fix: 'doc', doc: d, state: st });
    }
    if (listing.ownBike) mand.push({ key: 'bike', label: bi('Punya motor sendiri', 'Own a motorbike'), ok: !!state.config.ownsMotorcycle || state.config.commutePlanId === 'motorcycle' });
    if (listing.exp[1] > listing.exp[0]) pref.push({ label: bi(`Pengalaman ${listing.exp[1]} tahun`, `${listing.exp[1]} years of experience`), ok: ch.experienceYears >= listing.exp[1] });
    for (const s of listing.pref) pref.push({ label: bi(J().skillLabel[s].id, J().skillLabel[s].en), ok: ch.skills.includes(s) });

  const eventById = Object.fromEntries(EVENTS.map((e) => [e.id, e]));
  function unsafeOutcome(state, d, safeP) {
    const r = E.rng(state, 'unsafe');

    state.todayLog.lateNight = true;

  }
  function queueEvent(state, id, data = {}) {
    if (state.activeEvent && state.activeEvent.id === id) return;
    if (state.eventQueue.some((q) => q.id === id)) return;
    state.eventQueue.push({ id, data });
    pumpEvents(state);
  }
  function pumpEvents(state) {
    if (state.activeEvent || !state.eventQueue.length) return;
    const { id, data } = state.eventQueue.shift();
    const ev = eventById[id];
    if (!ev) return pumpEvents(state);
    const r = E.rng(state, 'event', id);
    const choices = ev.choices(state, data, r).map(({ effect, ...rest }, i) => ({ ...rest, idx: i }));
    state.activeEvent = { id, app: ev.app, title: ev.title, body: ev.body(state, data), choices, day: state.date.day, month: state.monthIndex, data };
    state.counters.eventsSeen++;
    E.notify(state, ev.app, ev.title, bi('Perlu keputusanmu.', 'Needs your decision.'), 'event');
  }
  function rollEvent(state) {
    if (state.trip && state.trip.active) return;
    const r = E.rng(state, 'roll');
    if (r() > CHANCE[state.config.difficulty]) return;
    const pool = EVENTS.filter((e) => e.random && (!e.when || e.when(state)));
    const totalW = pool.reduce((s, e) => s + e.weight, 0);
    let x = r() * totalW, ev = pool[0];
    for (const e of pool) { x -= e.weight; if (x <= 0) { ev = e; break; } }
    queueEvent(state, ev.id);
  }
  function resolveEvent(state, choiceIdx) {
    const ev = state.activeEvent;
    if (!ev) return { ok: false, error: 'no_event' };
    const def = eventById[ev.id];
    const ch = ev.choices[choiceIdx];
    if (!ch) return { ok: false, error: 'bad_choice' };
    const live = def.choices(state, ev.data, E.rng(state, 'event', ev.id))[choiceIdx];
    if (ch.cost > 0 && ch.loanId) {
      const loan = state.loans.find((l) => l.id === ch.loanId);
      const principal = loan ? loan.schedule.filter((x) => !x.paid).reduce((a, x) => a + x.principal, 0) : 0;
      const res = E.chargeOrFail(state, { merchant: loan ? loan.name : ev.title, category: 'loan', cls: 'loan_repay', amount: ch.cost, note: ch.label, split: { principal: Math.min(principal, ch.cost), interest: ch.cost - Math.min(principal, ch.cost) } });
      if (!res.ok) return res;
    } else if (ch.cost > 0) {
      const res = E.chargeOrFail(state, { merchant: ev.title, category: 'unexpected', cls: 'unexpected', amount: ch.cost, note: [ch.label, ch.note], split: { [ch.kind === 'discretionary' ? 'discretionary' : 'essential']: ch.cost } });
      if (!res.ok) return res;
      state.todayLog.unexpected += ch.cost;
    } else if (ch.cost < 0) E.credit(state, { merchant: ev.title, category: 'extra', cls: 'income_extra', amount: -ch.cost, note: [ch.label, ch.note] });
    state.activeEvent = null;
    if (ch.mood) E.applyMood(state, ch.mood);
    if (live && live.effect) live.effect(state);
    if (ch.skip) state.counters.skipped++;
    state.eventsLog.unshift({ ...E.stamp(state), title: ev.title, choice: ch.label, cost: ch.cost });
    if (state.eventsLog.length > 120) state.eventsLog.length = 120;
    pumpEvents(state);

  // ── morning ─────────────────────────────────────────────────────────
  function startOfDay(state, opts = {}) {

      if ((b.dueDay === day || (b.forcedAutopay && b.dueDay <= day)) && b.autopay) {
        const r = E.processBillPayment(state, b.id, { quiet: true });
        if (r.ok) E.notify(state, 'bills', bi('Bayar otomatis', 'Autopay'), bi(`${L(b.label)} dibayar: ${M.format(b.amount)}`, `${(b.label && b.label.en) || b.label} paid: ${M.format(b.amount)}`), 'info');

      }
      if (b.status !== 'paid' && day === b.dueDay && !b.autopay) E.notify(state, 'bills', bi('Tagihan jatuh tempo hari ini', 'Bill due today'), bi(`${L(b.label)}: ${M.format(b.amount)}`, `${(b.label && b.label.en) || b.label}: ${M.format(b.amount)}`), 'warn');
      if (b.status === 'pending' && day > b.dueDay) { b.status = 'overdue'; E.notify(state, 'bills', bi('Tagihan lewat jatuh tempo', 'Bill overdue'), bi(`${L(b.label)} jatuh tempo tgl ${b.dueDay}.`, `${(b.label && b.label.en) || b.label} was due on day ${b.dueDay}.`), 'warn'); }
    }

      if (res.ok) { sub.lastChargedMonth = state.monthIndex; E.applyMood(state, def.mood); }

    }

    if (state.dataPlanUntil && E.dayNumber(state.dataPlanUntil) === today - 1) E.notify(state, 'connect', bi('Paket data habis', 'Mobile data expired'), bi('Ojol, pesan antar, dan Appy butuh Wi-Fi atau paket data.', 'Ride-hailing, delivery and Appy need Wi-Fi or data.'), 'warn');

    const h = E.curHousing(state);

    no_helper: ['Tidak ada yang bisa membantu memasak.', 'Nobody is available to help cook.'], too_small: ['Tempat ini terlalu kecil untuk rumah tanggamu.', 'This place is too small for your household.'], needs_skill: ['Butuh literasi digital menengah atau keahlian kreatif.', 'Needs intermediate digital literacy or a creative skill.'],
    no_jkn: ['Kamu tidak punya JKN aktif.', 'You have no active JKN.'], not_claimable: ['Belum bisa diklaim.', 'Not claimable yet.'], needs_paklaring: ['Butuh paklaring.', 'Needs a paklaring.'], unavailable_area: ['Layanan ini tidak menjangkau daerahmu.', 'This service doesn\'t reach your area.'],
  };
  U.result = (res, okMsg) => {
    if (res && res.ok) { if (okMsg) U.toast(okMsg); return true; }
    const e = res && res.error;
    let msg = ERR[e] ? t(...ERR[e]) : t('Tidak berhasil.', 'That did not go through.');
    if (e === 'insufficient_funds' && res.shortBy) msg = t(`Ditolak: kurang ${fmt(res.shortBy)}.`, `Declined: ${fmt(res.shortBy)} short.`);
    if (res && res.reasons && res.reasons.length) msg += ' ' + res.reasons.map(L).join(' · ');
    if (res && res.missing && res.missing.length && e !== 'not_eligible') msg += ' ' + res.missing.map((m) => L(m.label)).join(', ');
    U.toast(msg, true);
    return false;
  };

  // ── navigation ──────────────────────────────────────────────────────
  U.openApp = (id, sub) => {
    ui.app = id; ui.nc = false; ui.switcher = false; ui.sheet = null;

    ui.recent = [id, ...ui.recent.filter((x) => x !== id)].slice(0, 8);

  };
  U.goHome = () => { ui.app = null; ui.nc = false; ui.switcher = false; ui.sheet = null; };
  U.back = () => {
    if (ui.sheet) { ui.sheet = null; return; }
    if (ui.nc) { ui.nc = false; return; }
    if (ui.switcher) { ui.switcher = false; return; }
    if (ui.app) {
      const st = ui.store[ui.app];
      if (st && st.view && st.view !== 'browse') { st.view = 'browse'; return; }
      const sb = ui.sub[ui.app];
      if (sb && sb.detail) { sb.detail = null; return; }
      U.goHome();
    }

  U.sub = (app, key, dflt) => ((ui.sub[app] || {})[key] ?? dflt);
  U.setSub = (app, patch) => { ui.sub[app] = { ...(ui.sub[app] || {}), ...patch }; };

  // ── frame pieces ────────────────────────────────────────────────────
  U.frame = (id, body, opts = {}) => {
    const a = U.APPS[id];
    return `<section class="app" aria-label="${T(a.name)}">
      <div class="app-head"><button class="back" data-a="back" aria-label="${t('Kembali', 'Back')}">${ic('ChevronLeft')}${esc(opts.backLabel || t('Beranda', 'Home'))}</button>

        <div class="bal">${t('Saldo', 'Balance')}<b class="num">${fmt(U.G.wallet)}</b></div></div>
      ${opts.tabs || ''}
      <div class="app-body" data-scroll="app:${id}:${opts.scrollKey || ''}">${body}</div>
      ${opts.foot || ''}
    </section>`;
  };
  U.tabs = (app, list, cur) => `<div class="tabs" role="tablist">${list.map(([k, l]) => `<button class="chip ${cur === k ? 'on' : ''}" role="tab" aria-selected="${cur === k}" data-a="tab" data-app="${app}" data-x="${k}">${esc(L(l))}</button>`).join('')}</div>`;

  U.sw = (action, key, on, label) => `<button class="sw ${on ? 'on' : ''}" data-a="${action}" data-x="${key}" role="switch" aria-checked="${!!on}" aria-label="${esc(label || key)}"></button>`;
  U.reqList = (items) => `<div class="reqs">${items.map((r) => `<div class="req ${r.ok ? 'ok' : r.optional || r.info ? 'opt' : 'no'}">${ic(r.ok ? 'Check' : r.optional || r.info ? 'Info' : 'X')}<span>${T(r.label)}</span>${r.fix && !r.ok ? `<button class="btn ghost sm" data-a="fix" data-x="${r.fix}" data-doc="${r.doc || ''}">${t('Urus', 'Fix')}</button>` : ''}</div>`).join('')}</div>`;

  // ── render ──────────────────────────────────────────────────────────
  U.render = () => {
    const rootEl = document.getElementById('app');
    const sc = rootEl.querySelector('[data-scroll]');
    if (sc) ui.scroll[sc.dataset.scroll] = sc.scrollTop;
    const af = document.activeElement;
    const focusId = af && af.id && rootEl.contains(af) ? af.id : null;
    const sel = focusId && af.selectionStart != null ? [af.selectionStart, af.selectionEnd] : null;
    rootEl.innerHTML = stageView();
    const sc2 = rootEl.querySelector('[data-scroll]');
    if (sc2 && ui.scroll[sc2.dataset.scroll] != null) sc2.scrollTop = ui.scroll[sc2.dataset.scroll];
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch { /* */ } } }
    U.updateClock();
  };
  function stageView() {
    return `<div class="stage">
      <aside class="side left" aria-label="${t('Ringkasan', 'Summary')}">${U.caseFile()}</aside>

  }
  U.langChip = (onWall) => `<button class="lang ${onWall ? 'on-wall' : ''}" data-a="lang" aria-label="${t('Ganti bahasa ke English', 'Switch language to Bahasa Indonesia')}"><b class="${I.lang === 'id' ? 'cur' : ''}">ID</b><b class="${I.lang === 'en' ? 'cur' : ''}">EN</b></button>`;
  U.statusBar = (onWall) => {
    const G = U.G;
    const power = E.electricityOn(G);
    const batt = G.owned.phoneCondition <= 0 ? 0 : power ? 82 : 14;
    const online = E.isOnline(G);
    const unread = G.notifications.filter((n) => !n.read).length;
    return `<div class="status ${onWall ? 'on-wall' : ''}">
      <button data-a="nc" aria-label="${t('Notifikasi', 'Notifications')} (${unread})"><span id="clock">--:--</span>${unread ? `<span class="unread">${unread}</span>` : ''}</button>
      <span class="notch" aria-hidden="true"></span>
      <span class="right">${U.langChip(onWall)}
        ${online ? ic(E.hasWifi(G) ? 'Wifi' : 'Signal') : `<span class="tiny" title="${t('Tidak ada koneksi', 'No connection')}">${ic('WifiOff')}</span>`}
        <span class="batt ${batt < 20 ? 'low' : ''}" aria-label="${t('Baterai', 'Battery')} ${batt}%"><b><i style="width:${batt}%"></i></b></span></span>
    </div>`;
  };
  U.updateClock = () => { const el = document.getElementById('clock'); if (!el) return; const d = new Date(); el.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

  function bannerView() {
    const G = U.G;
    if (!ui.banner || ui.nc || ui.sheet || ui.eventOpen) return '';
    const n = G.notifications.find((x) => x.id === ui.banner);
    if (!n) return '';
    if (n.tone === 'pay') {
      const amt = L(n.body).match(/\+Rp[\d.]+/);
      return `<button class="banner pay" data-a="open" data-x="bank">${U.appTile('bank')}
        <span style="flex:1;min-width:0"><span class="t">${t('GAJIAN', 'PAYDAY')} <span>${esc(E.dateLabel({ year: G.date.year, month: G.date.month, day: n.day }))}</span></span>
        <span class="b">${t('Gajimu sudah masuk.', 'Your salary has arrived.')}</span><div class="amt">${amt ? esc(amt[0]) : ''}</div></span></button>`;
    }
    return `<button class="banner ${n.tone === 'urge' ? 'urge' : ''}" data-a="notif" data-x="${n.id}">${U.appTile(U.appFor(n))}
      <span style="flex:1;min-width:0"><span class="t">${T(n.title)} <span>${t('baru', 'now')}</span></span><span class="b">${T(n.body)}</span></span></button>`;
  }
  function ncView() {
    const G = U.G;
    const items = G.notifications.slice(0, 70).map((n) => `<button class="ncard" data-a="notif" data-x="${n.id}">${U.appTile(U.appFor(n), 32)}
      <span style="flex:1;min-width:0"><span class="t">${T(n.title)} <span>${t('Hari', 'Day')} ${n.day}${n.month !== G.monthIndex ? ' · ' + t('bln lalu', 'last month') : ''}</span></span><span class="b">${T(n.body)}</span></span></button>`).join('');
    return `<div class="nc" role="dialog" aria-label="${t('Pusat notifikasi', 'Notification centre')}">
      <div class="row"><h2 class="nc-h">${t('Notifikasi', 'Notifications')}</h2><button class="btn sm sec" data-a="nc-clear">${t('Tandai dibaca', 'Mark read')}</button><button class="btn sm" data-a="nc">${t('Tutup', 'Close')}</button></div>
      <div class="scroll" data-scroll="nc">${items || `<div class="empty">${t('Belum ada.', 'Nothing yet.')}</div>`}</div></div>`;

  function switcherView() {
    const cards = ui.recent.map((id) => { const a = U.APPS[id]; return `<button class="sw-card" data-a="open" data-x="${id}"><span class="top" style="background:${a.color}"><span class="tile">${ic(a.icon)}</span>${T(a.name)}</span><span class="bodyp">${esc(U.appSummary(id))}</span></button>`; }).join('');
    return `<div class="switcher" role="dialog" aria-label="${t('Aplikasi terbaru', 'Recent apps')}"><div class="row" style="color:#fff"><b style="flex:1;font-size:18px">${t('Aplikasi terbaru', 'Recent apps')}</b><button class="btn sm sec" data-a="switcher">${t('Tutup', 'Close')}</button></div>
